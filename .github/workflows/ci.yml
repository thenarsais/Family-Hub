name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ================================================
  # CODE QUALITY & LINTING
  # ================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Check formatting
        run: npm run format:check --if-present

  # ================================================
  # TYPESCRIPT COMPILATION
  # ================================================
  build:
    name: Build TypeScript
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist

  # ================================================
  # UNIT & INTEGRATION TESTS (backend + frontend, with coverage)
  # ================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: familyhub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # These previously ran `npm run test:unit --if-present` /
      # `test:integration --if-present` at the repo root, where neither
      # script exists -- `--if-present` silently no-ops, so this job passed
      # without ever running a test. Run each workspace's real
      # coverage-enforced suite directly instead.
      - name: Run backend tests (with 80% coverage gate)
        working-directory: ./backend
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/familyhub_test
          REDIS_URL: redis://localhost:6379

      # Placeholder values, not real secrets -- src/__tests__/config/env.test.ts
      # only checks that these vars are present and correctly shaped, never
      # that they connect to anything real.
      - name: Run frontend tests (with 80% coverage gate)
        working-directory: ./frontend
        run: npm run test:coverage
        env:
          VITE_API_URL: http://localhost:3000
          VITE_SUPABASE_URL: https://test-project.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage/
            frontend/coverage/

  # ================================================
  # API ENDPOINT TESTS
  # ================================================
  api-tests:
    name: API Endpoint Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: backend/dist

      - name: Start API server
        run: npm start &
        env:
          NODE_ENV: development
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/familyhub
          REDIS_URL: redis://localhost:6379
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Wait for server startup
        run: |
          for i in {1..30}; do
            curl -f http://localhost:3000/health && echo "API is ready" && break
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Run API health checks
        run: |
          echo "Testing health endpoint..."
          curl -f http://localhost:3000/health || exit 1

          echo "Testing readiness endpoint..."
          curl -f http://localhost:3000/ready || exit 1

          echo "Testing info endpoint..."
          curl -f http://localhost:3000/info || exit 1

          echo "✅ All API tests passed!"

  # ================================================
  # DOCKER BUILD & PUSH
  # ================================================
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, api-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  # ================================================
  # SECURITY SCANNING & DEPENDENCY AUDIT
  # ================================================
  security:
    name: Security Scan & Audit
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check backend dependencies for vulnerabilities
        run: |
          cd backend
          echo "🔍 Checking backend dependencies..."
          npm audit --omit=dev --audit-level=high
          echo "✅ Backend audit passed"

      - name: Check frontend dependencies for vulnerabilities
        run: |
          cd frontend
          echo "🔍 Checking frontend dependencies..."
          # --omit=dev: this gate is for what actually ships to users. Without
          # it, the frontend's own build/audit tooling (Lighthouse CI, Vite)
          # fails the check on high-severity CVEs in packages that never leave
          # the CI runner — real findings, but no user is ever exposed to them.
          npm audit --omit=dev --audit-level=high
          echo "✅ Frontend audit passed"

      - name: Generate audit report
        if: always()
        run: |
          echo "## 🔒 Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Audit" >> $GITHUB_STEP_SUMMARY
          cd backend && npm audit --json > audit-backend.json 2>&1 || true
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat audit-backend.json | jq '.metadata.vulnerabilities' 2>/dev/null || echo "No JSON output" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Audit" >> $GITHUB_STEP_SUMMARY
          cd ../frontend && npm audit --json > audit-frontend.json 2>&1 || true
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat audit-frontend.json | jq '.metadata.vulnerabilities' 2>/dev/null || echo "No JSON output" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ================================================
  # LIGHTHOUSE CI (PERFORMANCE)
  # ================================================
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Start development server
        run: |
          cd frontend
          npm run preview &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to start
          for i in {1..30}; do
            curl -f http://localhost:4173 && echo "Server ready" && break
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

      # lhci autorun = collect + assert against frontend/lighthouserc.json's
      # thresholds (matching the targets summarized below) + save results
      # locally. Previously ran `lighthouse:collect` (collect only, no
      # assertions) against port 5173 (the dev server) while this job's own
      # server was `vite preview` on 4173 -- collect was silently failing to
      # connect, and `|| true` swallowed it, so this gate asserted nothing.
      - name: Run Lighthouse CI
        run: cd frontend && npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Generate performance report
        if: always()
        run: |
          echo "## 📊 Lighthouse Performance Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Performance audit completed for:" >> $GITHUB_STEP_SUMMARY
          echo "- Homepage (http://localhost:5173)" >> $GITHUB_STEP_SUMMARY
          echo "- Login page (http://localhost:5173/login)" >> $GITHUB_STEP_SUMMARY
          echo "- Dashboard (http://localhost:5173/dashboard)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Measured metrics:" >> $GITHUB_STEP_SUMMARY
          echo "- Performance (target: 80+)" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility (target: 90+)" >> $GITHUB_STEP_SUMMARY
          echo "- Best Practices (target: 85+)" >> $GITHUB_STEP_SUMMARY
          echo "- SEO (target: 80+)" >> $GITHUB_STEP_SUMMARY
          echo "- Cumulative Layout Shift (target: 0.1 or better)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci

  # ================================================
  # BUILD STATISTICS & PERFORMANCE BASELINE
  # ================================================
  performance-baseline:
    name: Build Statistics
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate build statistics
        run: |
          echo "=== Build Statistics ===" > build-stats.txt
          echo "Build time: $(date)" >> build-stats.txt
          echo "Node version: $(node -v)" >> build-stats.txt
          echo "npm version: $(npm -v)" >> build-stats.txt

          # Check dist size
          if [ -d "backend/dist" ]; then
            echo "Dist folder size: $(du -sh backend/dist | cut -f1)" >> build-stats.txt
            echo "Main bundle size: $(ls -lh backend/dist/server.js | awk '{print $5}')" >> build-stats.txt
          fi

          cat build-stats.txt

      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: build-stats.txt

      # Frontend bundle size budget gate (SDLC decision #9). This job builds
      # the backend for stats above but never built the frontend, so there
      # was never a real frontend bundle number to gate here despite the
      # decision assuming one already existed.
      - name: Build frontend
        run: cd frontend && npm run build

      - name: DEBUG bundle content
        run: |
          echo "node: $(node -v)"
          F=$(ls frontend/dist/assets/*.js)
          echo "file: $F ($(wc -c < "$F") bytes)"
          echo "dev-marker matches:"
          grep -o "Warning: [A-Za-z][A-Za-z ]*" "$F" | sort -u | head -20 || echo "(none)"
          echo "NODE_ENV literal occurrences: $(grep -o "process.env.NODE_ENV" "$F" | wc -l)"

      - name: Check frontend bundle size budget (fails if >10% over baseline)
        run: cd frontend && npm run check:bundle-budget

  # ================================================
  # SUMMARY & NOTIFICATIONS
  # ================================================
  summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [lint, build, test, api-tests, docker, security, lighthouse, performance-baseline]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Check job status
        run: |
          echo "=== CI/CD Pipeline Summary ==="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "API Tests: ${{ needs.api-tests.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Lighthouse: ${{ needs.lighthouse.result }}"
          echo "Performance Baseline: ${{ needs.performance-baseline.result }}"

      - name: Determine pipeline status
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.api-tests.result }}" = "failure" ]; then
            echo "❌ Pipeline FAILED"
            exit 1
          else
            echo "✅ Pipeline PASSED"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ CI/CD Pipeline Results

              - **Lint**: ${{ needs.lint.result }}
              - **Build**: ${{ needs.build.result }}
              - **Tests**: ${{ needs.test.result }}
              - **API Tests**: ${{ needs.api-tests.result }}
              - **Security**: ${{ needs.security.result }}

              [View full workflow](${context.payload.pull_request.html_url}/checks)`
            })
