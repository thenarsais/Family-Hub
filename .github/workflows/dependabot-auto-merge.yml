name: Dependabot Auto-Merge

# SDLC decision #13: minor/patch dependency PRs auto-merge once CI passes;
# major-version bumps are left for manual review (no auto-merge label).
#
# Requires two repo-level settings this workflow can't enable itself:
# "Allow auto-merge" (Settings > General) and branch protection required
# status checks on main naming this workflow's actual CI job names -- until
# both are on, `gh pr merge --auto` below will error out harmlessly (the PR
# just sits waiting like any other, nothing merges early).

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependency metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor/patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "Major version bump — needs manual review, not auto-merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
