                      status: { type: string, const: success }
                      timestamp: { type: string, format: date-time }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
    post:
      tags: [Trivia]
      summary: Record today's answer (points, flat by difficulty, only if correct)
      operationId: submitTriviaToday
      description: A second submit the same day is a no-op and returns the current state.
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, description: Must be one of the question's four options. }
      responses:
        '200':
          description: The updated daily trivia payload (attempt now populated).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TriviaToday'
                  - type: object
                    properties:
                      status: { type: string, const: success }
                      timestamp: { type: string, format: date-time }
        '400': { description: Missing answer, or not one of the options., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '503': { description: No trivia question is available (empty bank)., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

