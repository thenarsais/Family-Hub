  # ================================================================
  # SMARTTHINGS (no auth)
  # ================================================================
  /api/smartthings/devices:
    get:
      tags: [SmartThings]
      summary: List all known SmartThings devices
      operationId: listSmartDevices
      responses:
        '200':
          description: Devices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/SmartDevice' }
                  count: { type: integer }
                  timestamp: { type: string, format: date-time }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/smartthings/devices/{deviceId}:
    get:
      tags: [SmartThings]
      summary: Get one device's details
      operationId: getSmartDevice
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      responses:
        '200':
          description: Device.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  device: { $ref: '#/components/schemas/SmartDevice' }
                  timestamp: { type: string, format: date-time }
        '404':
          description: Device not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    put:
      tags: [SmartThings]
      summary: Send a control command to a device (on/off/brightness/temperature/lock/unlock)
      operationId: controlSmartDevice
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [on, turn-on, off, turn-off, setbrightness, brightness, settemperature, temperature, lock, unlock]
                arguments:
                  type: array
                  items: {}
                  description: "arguments[0] is required (brightness level or temperature) for the brightness/temperature commands."
      responses:
        '200':
          description: Command executed (or failed at the device layer — still a 200; check `status`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success, failed] }
                  message: { type: string }
                  device: { $ref: '#/components/schemas/SmartDevice' }
                  command: { type: string }
                  arguments: { type: array, items: {} }
                  duration: { type: string, example: "42ms" }
                  timestamp: { type: string, format: date-time }
        '400':
          description: Missing command, missing required argument, or unknown command.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: Device not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/smartthings/status:
    get:
      tags: [SmartThings]
      summary: Aggregate SmartThings system status
      operationId: getSmartThingsStatus
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    type: object
                    properties:
                      online: { type: boolean }
                      totalDevices: { type: integer }
                      devicesByType:
                        type: object
                        properties:
                          lights: { type: integer }
                          locks: { type: integer }
                          climate: { type: integer }
                          switches: { type: integer }
                          sensors: { type: integer }
                          other: { type: integer }
                      devicesByStatus:
                        type: object
                        properties:
                          online: { type: integer }
                          offline: { type: integer }
                      lastSync: { type: string, format: date-time }
                  timestamp: { type: string, format: date-time }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/smartthings/discover:
    post:
      tags: [SmartThings]
      summary: Discover and sync devices from the SmartThings cloud API (or mock devices if no token configured)
      operationId: discoverSmartDevices
      responses:
        '200':
          description: Discovery result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string }
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/SmartDevice' }
                  count: { type: integer }
                  duration: { type: string }
                  timestamp: { type: string, format: date-time }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/smartthings/devices/{deviceId}/history:
    get:
      tags: [SmartThings]
      summary: Get device control history
      description: "Queries a `point_transactions` table that does not appear in `types/database.ts` at all; rows are returned as-is (loosely typed) rather than mapped to a known schema."
      operationId: getSmartDeviceHistory
      parameters:
        - $ref: '#/components/parameters/DeviceIdPath'
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        '200':
          description: History rows (untyped passthrough of point_transactions rows filtered by description LIKE %deviceId%).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  deviceId: { type: string }
                  history: { type: array, items: { type: object } }
                  count: { type: integer }
                  timestamp: { type: string, format: date-time }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

