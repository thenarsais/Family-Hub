        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  # ================================================================
  # KIDS BOARD — a parent acting for a young child (x-user-id = the parent)
  # ================================================================
  /api/kids/{memberId}/routines:
    get:
      tags: [Kids]
      summary: The child's routine checklist + today's ticks
      description: >-
        `memberId` is the child; `x-user-id` is the caller, who must be that
        child or an active parent/admin in the same family.
      operationId: getKidRoutines
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: scope
          in: query
          description: "`board` (default) = enabled checklist items; `manage` = every item incl. hidden."
          schema: { type: string, enum: [board, manage], default: board }
      responses:
        '200':
          description: Routines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  routines:
                    type: array
                    items: { $ref: '#/components/schemas/RoutineWithStatus' }
                  count: { type: integer }
                  timestamp: { type: string, format: date-time }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller may not act for this member., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
    post:
      tags: [Kids]
      summary: Add a routine item to the child's list (parent only)
      operationId: createKidRoutine
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot, label, emoji]
              properties:
                slot: { type: string, enum: [morning, evening] }
                label: { type: string }
                emoji: { type: string }
                sortOrder: { type: integer }
      responses:
        '201':
          description: Routine created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Routine created" }
                  routine: { $ref: '#/components/schemas/Routine' }
                  timestamp: { type: string, format: date-time }
        '400': { description: Missing/invalid slot / label / emoji., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Not a parent for this member., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/kids/{memberId}/routines/{id}:
    patch:
      tags: [Kids]
      summary: Edit / enable-disable a routine item (parent only)
      operationId: updateKidRoutine
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                slot: { type: string, enum: [morning, evening] }
                label: { type: string }
                emoji: { type: string }
                sortOrder: { type: integer }
                enabled: { type: boolean }
      responses:
        '200':
          description: Routine updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Routine updated" }
                  routine: { $ref: '#/components/schemas/Routine' }
                  timestamp: { type: string, format: date-time }
        '400': { description: Invalid slot., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '404': { description: No such routine the caller may edit., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/kids/{memberId}/routines/{id}/complete:
    post:
      tags: [Kids]
      summary: Tick a routine off for today (idempotent)
      operationId: completeKidRoutine
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Routine done" }
                  timestamp: { type: string, format: date-time }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller may not act for this member., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '404': { description: Routine not found for this member., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
    delete:
      tags: [Kids]
      summary: Un-tick today's completion
      operationId: undoKidRoutine
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Un-ticked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Routine un-ticked" }
                  timestamp: { type: string, format: date-time }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller may not act for this member., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '404': { description: Nothing to undo today., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/kids/{memberId}/mood:
    get:
      tags: [Kids]
      summary: The child's mood for the family-local today
      operationId: getKidMood
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Today's mood, or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  mood:
                    oneOf:
                      - { $ref: '#/components/schemas/MoodEntry' }
                      - { type: 'null' }
                  timestamp: { type: string, format: date-time }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller may not act for this member., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
    post:
      tags: [Kids]
      summary: Record the child's mood for today (parent tap)
      operationId: setKidMood
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mood]
              properties:
                mood: { type: string, enum: [great, good, ok, low, sad] }
      responses:
        '200':
          description: Mood recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Mood recorded" }
                  mood: { $ref: '#/components/schemas/MoodEntry' }
                  timestamp: { type: string, format: date-time }
        '400': { description: Invalid mood value., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller may not act for this member., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  # ================================================================
  # KIOSK (T-14 — x-user-id for management; x-kiosk-token for /session)
  # ================================================================
  /api/kiosk/enroll:
    post:
      tags: [Kiosk]
      summary: Register this device as a family display (parent only)
      operationId: enrollKioskDevice
      security: [{ userIdHeader: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80, description: A name for the display, e.g. "Kitchen wall". }
      responses:
        '201':
          description: Device enrolled. The raw token is returned exactly once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  token: { type: string, description: Raw device token — store it on the display; not retrievable again. }
                  deviceId: { type: string, format: uuid }
                  familyId: { type: string, format: uuid }
                  timestamp: { type: string, format: date-time }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller is not a parent/admin., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/kiosk/devices:
    get:
      tags: [Kiosk]
      summary: List the household's registered displays (parent only)
      operationId: listKioskDevices
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: The registered displays (no tokens).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  devices: { type: array, items: { $ref: '#/components/schemas/KioskDevice' } }
                  count: { type: integer }
                  timestamp: { type: string, format: date-time }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller is not a parent/admin., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/kiosk/devices/{id}:
    delete:
      tags: [Kiosk]
      summary: Revoke a registered display (parent only)
      operationId: revokeKioskDevice
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Display revoked., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeSuccess' } } } }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller is not a parent/admin., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '404': { description: No such display in this household., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/kiosk/session:
    post:
      tags: [Kiosk]
      summary: Exchange a device token for the household boot payload (no user login)
      operationId: startKioskSession
      security: [{ kioskTokenHeader: [] }]
      responses:
        '200':
          description: The household, its members, and kiosk settings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/KioskBootstrap'
                  - type: object
                    properties:
                      status: { type: string, const: success }
                      timestamp: { type: string, format: date-time }
        '401': { description: Missing or unrecognised x-kiosk-token., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '404': { description: Household not found., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/kiosk/pin:
    put:
      tags: [Kiosk]
      summary: Set or replace the household PIN (parent only)
      operationId: setKioskPin
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^\d{4}$', description: Exactly 4 digits. }
      responses:
        '200': { description: PIN set., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeSuccess' } } } }
        '400': { description: PIN is not exactly 4 digits., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller is not a parent/admin., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
    delete:
      tags: [Kiosk]
      summary: Remove the household PIN (parent only)
      operationId: clearKioskPin
      security: [{ userIdHeader: [] }]
      responses:
        '200': { description: PIN removed., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeSuccess' } } } }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: Caller is not a parent/admin., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/kiosk/pin/verify:
    post:
      tags: [Kiosk]
      summary: Check a PIN attempt (any member; rate-limited per device)
      operationId: verifyKioskPin
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
      responses:
        '200':
          description: PIN correct.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  ok: { type: boolean, const: true }
                  timestamp: { type: string, format: date-time }
        '400': { description: pin missing., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '401': { description: Missing x-user-id, or incorrect PIN., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '429': { description: Too many attempts from this device., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  # ================================================================
  # LEARNING (x-user-id)
  # ================================================================
  /api/learning/lessons:
    get:
      tags: [Learning]
      summary: The Gujarati curriculum with this user's per-lesson completion
      operationId: listLessons
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: category, in: query, required: false, schema: { type: string, enum: [alphabet, numbers, vocabulary] } }
        - { name: phase, in: query, required: false, schema: { type: string } }
        - { name: subcategory, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Lessons (ordered by phase, subcategory, sequence).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  lessons: { type: array, items: { $ref: '#/components/schemas/LessonWithProgress' } }
                  count: { type: integer }
                  timestamp: { type: string, format: date-time }
        '400': { description: Bad category., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/learning/lessons/{id}:
    get:
      tags: [Learning]
      summary: One lesson plus this user's progress on it
      operationId: getLesson
      security: [{ userIdHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The lesson.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  lesson: { $ref: '#/components/schemas/LessonWithProgress' }
                  timestamp: { type: string, format: date-time }
        '401': { description: Missing x-user-id., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '404': { description: No such lesson., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '500': { description: Unexpected failure., content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  /api/learning/lessons/{lessonId}/complete:
    post:
      tags: [Learning]
      summary: Record lesson completion and award points
      operationId: completeLesson
      description: category / phase / points are read from the lesson row; the request body is ignored.
      security: [{ userIdHeader: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Lesson completion recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Lesson completed successfully" }
                  progress: { $ref: '#/components/schemas/LearningProgressEntry' }
                  stats: { $ref: '#/components/schemas/LearningStats' }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No lesson with that id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/learning/lessons/{lessonId}/trace-complete:
    post:
      tags: [Learning]
      summary: Record a trace-mode session (T-25 / FR-143)
      operationId: completeTrace
      description: |
        Points (+15) are awarded only the first time a lesson is successfully
        traced — a repeat trace is practice only (`alreadyTraced: true`, no
        second ledger entry). Independent of `/complete`; a lesson can be
        traced without ever going through Learn or Quiz.
      security: [{ userIdHeader: [] }]
      parameters:
        - name: lessonId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Trace session recorded.
          content:
            application/json:
              schema:
                type: object
