  # ================================================================
  # REMINDERS (x-user-id)
  # ================================================================
  /api/reminders:
    get:
      tags: [Reminders]
      summary: List every reminder in the caller's family
      description: >-
        Family-scoped. Each row carries `assignee_name`. Stale recurring reminders
        are rolled forward to their next occurrence as a side effect of this read
        (there is no job runner yet).
      operationId: listReminders
      security: [{ userIdHeader: [] }]
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [pending, dismissed, all], default: all }
      responses:
        '200':
          description: Reminders (empty array if the caller has no family).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      count: { type: integer }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Reminder' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    post:
      tags: [Reminders]
      summary: Create a reminder
      description: >-
        The reminder is created in the caller's family. `assignee_user_id`
        defaults to the caller; anyone in the family may be assigned.
      operationId: createReminder
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, scheduled_time]
              properties:
                title: { type: string }
                description: { type: string }
                reminder_type: { type: string, enum: [chore, assignment, event, goal, custom], default: custom }
                assignee_user_id:
                  type: string
                  format: uuid
                  description: Family member the reminder is for. Defaults to the caller.
                scheduled_time: { type: string, format: date-time }
                recurrence: { type: string, enum: [once, daily, weekly, monthly], default: once }
                recurrence_end_date: { type: string, format: date }
                related_item_id:
                  type: string
                  description: Links the reminder to another item (e.g. a calendar event id, or its series recurringEventId).
                related_item_type:
                  type: string
                  description: What related_item_id points at, e.g. "calendar_event".
                remind_before_minutes:
                  type: integer
                  minimum: 0
                  description: Lead time before the source item; the reminder still fires at scheduled_time, this is for display / de-dupe.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Reminder' }
        '400':
          description: Invalid body, or `assignee_user_id` is not a member of the caller's family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: The caller has no family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/reminders/upcoming:
    get:
      tags: [Reminders]
      summary: Family reminders due in the next 24 hours
      operationId: getUpcomingReminders
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: Upcoming reminders.
          content:
            application/json:
              schema:
