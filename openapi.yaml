        '200':
          description: Weather.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherData' }
        '400':
          description: Empty city parameter.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '404':
          description: Weather not found for city.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '401':
          description: Missing authorization header.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }

  /api/external/weather/coords:
    get:
      tags: [ExternalAPIs]
