  # ================================================================
  # PERFORMANCE (no auth)
  # ================================================================
  /performance/health:
    get:
      tags: [Performance]
      summary: Overall system health (query/request/compression stats)
      operationId: getPerformanceHealth
      responses:
        '200':
          description: Health snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: healthy }
                  timestamp: { type: string, format: date-time }
                  database: { type: object }
                  requests: { type: object }
                  compression: { type: object }

  /performance/queries:
    get:
      tags: [Performance]
      summary: Query performance statistics, slow queries, and recommendations
      operationId: getQueryPerformance
      responses:
        '200':
          description: Query stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statistics: { type: [object, 'null'] }
                  slowQueries: { type: array, items: { type: object } }
                  recommendations: { type: array, items: {} }

  /performance/queries/slow:
    get:
      tags: [Performance]
      summary: Get slow queries
      operationId: getSlowQueries
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Slow queries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  queries: { type: array, items: { type: object } }

  /performance/queries/n-plus-one:
    get:
      tags: [Performance]
      summary: Detect N+1 query patterns
      operationId: getNPlusOnePatterns
      responses:
        '200':
          description: Patterns (or an explicit "none detected" message).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, description: "Only present when no patterns were detected." }
                  patternsDetected: { type: integer, description: "Only present when patterns were detected." }
                  patterns:
                    type: array
                    items:
                      type: object
                      properties:
                        pattern: { type: string }
                        occurrences: { type: integer }

  /performance/requests:
    get:
      tags: [Performance]
      summary: Request performance statistics, recent requests, recent errors
      operationId: getRequestPerformance
      responses:
        '200':
          description: Stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statistics: { type: [object, 'null'] }
                  recentRequests: { type: array, items: { type: object } }
                  recentErrors: { type: array, items: { type: object } }

  /performance/compression:
    get:
      tags: [Performance]
      summary: Response compression statistics
      operationId: getCompressionStats
      responses:
        '200':
          description: Stats (or an explicit "no data yet" message).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, description: "Only present when no compression data is available yet." }
                  compressionRatio: { type: number }
                  totalBytesSaved: { type: integer }

  /performance/indexes:
    get:
      tags: [Performance]
      summary: Database index monitoring queries (informational SQL, not executed)
      operationId: getIndexMonitoringQueries
      responses:
        '200':
          description: SQL snippets to run manually.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  queries: { type: object }

  /performance/summary:
    get:
      tags: [Performance]
      summary: Complete performance summary (query + request + compression + overall health rollup)
      operationId: getPerformanceSummary
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp: { type: string, format: date-time }
                  database:
                    type: object
                    properties:
                      queries: { type: [object, 'null'] }
                      recommendations: { type: array, items: {} }
                      nPlusOnePatterns: { type: integer }
                  requests: { type: [object, 'null'] }
                  compression: { type: [object, 'null'] }
                  overallHealth:
                    type: object
                    properties:
                      databaseHealth: { type: string, enum: [good, "needs attention", "no data"] }
                      requestHealth: { type: string, enum: [good, "needs attention", "no data"] }

  /performance/index-sql:
    post:
      tags: [Performance]
      summary: Generate recommended CREATE INDEX SQL for a table
      operationId: getIndexSql
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                table: { type: string }
      responses:
        '200':
          description: Generated SQL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sql: { type: string }
                  message: { type: string }
        '500':
          description: Failed to generate SQL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>` must be present. Used by `auth`,
        `users`, `badges`, `points`, `external-apis`. For most routes in
        this group the server only checks the header is present and
        prefixed `Bearer ` — it does not cryptographically verify the
        token (the one exception is `GET /auth/me`, which does call
        `supabase.auth.getUser(token)`).
    userIdHeader:
      type: apiKey
      in: header
      name: x-user-id
      description: |
        Custom header identifying the caller by user ID. Used by `chores`,
        `learning`, `announcements`, `reminders`, `energy`, `calendar`,
        `family`, `activity-log`. There is no cryptographic verification —
        any UUID-shaped (or even arbitrary) value is trusted as-is. A few
        endpoints within these route files (e.g. `GET /api/energy/usage`,
        `POST /api/activity/log`, several PATCH/DELETE-by-id endpoints in
        `announcements`/`reminders`/`calendar`) do not actually check this
        header despite living in the same route file — see the per-endpoint
        `security` field and description for exceptions.
    kioskTokenHeader:
      type: apiKey
      in: header
      name: x-kiosk-token
      description: |
        Raw device token issued by `POST /api/kiosk/enroll`, presented by a
        registered wall display on `POST /api/kiosk/session` to boot into its
        household with no user login. The server sha256-hashes it and matches
        against `kiosk_devices.token_hash`.

  parameters:
    UserIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPathBadges:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      schema: { type: string }

  schemas:
    # ---------------- Generic envelopes ----------------
    EnvelopeSuccess:
      type: object
      description: |
        The success shape used by MOST (not all) "newer" routes. `count`
        is present on list endpoints, absent on single-resource endpoints.
        `data`'s actual type varies per endpoint — see the `allOf` override
        on each path.
      required: [status, timestamp]
      properties:
        status: { type: string, const: success }
        data: {}
        count: { type: integer }
        timestamp: { type: string, format: date-time }

    EnvelopeError:
      type: object
      description: The error shape used consistently by all "newer" routes (chores, learning, announcements, reminders, energy, calendar, family, activity-log, smartthings).
      required: [status, message]
      properties:
        status: { type: string, const: error }
        message: { type: string }
        error: { type: string, description: "Present on most (not all) error responses; usually a raw error message string." }

    LegacyErrorBody:
      type: object
      description: The ad hoc error shape used by "older" routes (auth, users, badges, points, external-apis). No `status`/`timestamp` field; shape varies slightly per endpoint but always includes `error`.
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        required: { type: array, items: { type: string }, description: "Present only on some 'missing required fields' 400s." }

    ReadinessResult:
      type: object
      properties:
        status: { type: string, enum: [ready, not_ready] }
        timestamp: { type: string, format: date-time }
        checks: { type: array, items: { type: object } }
        summary: { type: object }

    DeploymentHealth:
      type: object
      required: [status, timestamp, environment, uptime, version]
      properties:
        status: { type: string, const: ok }
        timestamp: { type: string, format: date-time }
        environment: { type: string }
        uptime: { type: number, description: process.uptime() in seconds }
        version: { type: string }

    EmailSentResponse:
      type: object
      properties:
        message: { type: string }
        messageId: { type: string, description: "'demo-<timestamp>' when SENDGRID_API_KEY is unset (demo mode), otherwise SendGrid's x-message-id response header, or 'unknown'." }

    # ---------------- Users / Auth ----------------
    User:
      type: object
      description: |
        Raw `users` table row, from `UserRepository`. NOTE: `birth_year`
        and `is_under_13` are read/written by real code (see
        `POST /api/family/children`) but are absent from the generated
        `types/database.ts` — the generated types are stale relative to
        the live schema; they are included here because they are real.
      required: [id, email, name, role, account_type, is_active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [parent, child] }
        account_type: { type: string, enum: [primary, coparent, guardian, child] }
        password_hash: { type: string, description: "Internally, this column stores the Supabase Auth user ID as a reference, not an actual password hash." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login: { type: [string, 'null'], format: date-time }
        is_active: { type: boolean }
        birth_year: { type: [integer, 'null'] }
        is_under_13: { type: [boolean, 'null'] }

    UserProfileFull:
      type: object
      description: Subset returned by GET /api/users/me.
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        account_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserProfileBasic:
      type: object
      description: Subset returned by GET/PUT /api/users/{id}.
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        created_at: { type: string, format: date-time }

    # ---------------- Badges / Points ----------------
    Badge:
      type: object
      description: Raw `badges` table row.
      required: [id, title, category, tier]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        icon_emoji: { type: [string, 'null'] }
        category: { type: string }
        tier: { type: string, enum: [bronze, silver, gold, platinum] }
        points_required: { type: [integer, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    ActivityPointsEntry:
      type: object
      description: Raw `activity_points` table row (the one real points ledger; used by PointsRepository and by chores/learning point awards).
      required: [id, user_id, activity_type, points, reason]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        activity_type: { type: string }
        points: { type: number }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    # ---------------- SmartThings ----------------
    SmartDevice:
      type: object
      description: |
        Hand-rolled device shape from `smartthings_devices` table (via
        `SmartThingsService`), NOT the Supabase `smart_devices` table in
        `types/database.ts` (different table, different columns entirely).
      required: [deviceId, name, type, status]
      properties:
        deviceId: { type: string }
        name: { type: string }
        type: { type: string, enum: [light, switch, lock, climate, sensor, other] }
        room: { type: string }
        status: { type: object, additionalProperties: true, description: "Free-form capability/state map, e.g. {switch:'on', level:100} or {temperature:72, mode:'heat'}." }

    # ---------------- Chores (hand-rolled schema) ----------------
    Chore:
      type: object
      description: |
        From `ChoreService`'s raw-Postgres `chores` table — NOT the
        Supabase `chores` table in `types/database.ts` (which has entirely
        different columns: child_id/priority/status/due_date). This
        feature area's real schema is user_id/name/time_slot/points_value/enabled.
      required: [id, userId, name, timeSlot, pointsValue, enabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        timeSlot: { type: string, enum: [morning, afternoon, evening] }
        pointsValue: { type: number }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ChoreWithStatus:
      description: >-
        A `Chore` plus today's state — what `GET /api/chores` returns.
        `assigneeName` is the display name of `userId`. `completedToday` reflects
        the family's local calendar day; `completionId` is set only when it is
        true, so the client can offer "undo".
      allOf:
        - $ref: '#/components/schemas/Chore'
        - type: object
          required: [completedToday]
          properties:
            assigneeName: { type: [string, 'null'] }
            completedToday: { type: boolean }
            completionId: { type: [string, 'null'], format: uuid }

    ChoreCompletion:
      type: object
      required: [id, choreId, userId, completedAt, pointsEarned]
      properties:
        id: { type: string, format: uuid }
        choreId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        pointsEarned: { type: number }

    ChoreProgress:
      type: object
      properties:
        totalCompleted: { type: integer }
        thisWeek: { type: integer }
        thisMonth: { type: integer }
        pointsEarned: { type: integer }

    ChorePointsSummary:
      type: object
      properties:
        totalPoints: { type: integer }
        dailyPoints: { type: integer }
        weeklyPoints: { type: integer }
        monthlyPoints: { type: integer }

    # ---------------- Homework (hand-rolled schema, migration 019) ----------------
    HomeworkItem:
      type: object
      description: >-
        From HomeworkService's raw-Postgres `homework_items` table (migration
        019). Dated one-shot items: `completedAt` / `pointsEarned` live on the
        row, there is no completions table. `userId` is the assignee; `dueDate`
        is a plain calendar date (YYYY-MM-DD).
      required: [id, userId, title, dueDate, pointsValue, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        createdBy: { type: string, format: uuid }
        title: { type: string }
        subject: { type: string }
        dueDate: { type: string, format: date }
        pointsValue: { type: integer }
        completedAt: { type: [string, 'null'], format: date-time }
        pointsEarned: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HomeworkItemWithStatus:
      description: >-
        A `HomeworkItem` plus derived state — what `GET /api/homework` returns.
        `isOverdue` is true when the item is incomplete and its `dueDate` is
        before the family-local today; `completed` mirrors `completedAt != null`.
      allOf:
        - $ref: '#/components/schemas/HomeworkItem'
        - type: object
          required: [isOverdue, completed]
          properties:
            assigneeName: { type: [string, 'null'] }
            addedByName: { type: [string, 'null'] }
            isOverdue: { type: boolean }
            completed: { type: boolean }

    # ---------------- Reading (hand-rolled schema, migration 020) ----------------
    ReadingGoals:
      type: object
      description: >-
        Per-user reading goals (`reading_goals`). Missing rows default to
        20 daily / 100 weekly minutes and 10 points.
      required: [dailyMinutes, weeklyMinutes, pointsValue]
      properties:
        dailyMinutes: { type: integer }
        weeklyMinutes: { type: integer }
        pointsValue: { type: integer }

    ReadingGoalsWithMember:
      description: A `ReadingGoals` tagged with the family member it belongs to.
      allOf:
        - $ref: '#/components/schemas/ReadingGoals'
        - type: object
          required: [userId]
          properties:
            userId: { type: string, format: uuid }
            name: { type: [string, 'null'] }

    ReadingLog:
      type: object
      description: >-
        Today's reading log, if any. `goalMet` / `pointsEarned` are snapshotted
        against the daily goal at the moment it was logged, not read live from
        `reading_goals` — a later goal edit never rewrites history.
      required: [minutes, goalMet, pointsEarned]
      properties:
        minutes: { type: integer }
        goalMet: { type: boolean }
        pointsEarned: { type: integer }

    # ---------------- Kung Fu (hand-rolled schema, migration 021) ----------------
    KungFuProfile:
      type: object
      description: >-
        Per-user kung fu profile (`kungfu_profiles`). `belt` is set manually by
        a parent — there is no auto-calculated progression. Missing rows
        default to no belt and 15/5 points.
      required: [belt, beltSince, pointsPerClass, pointsPerPractice]
      properties:
        belt: { type: [string, 'null'] }
        beltSince: { type: [string, 'null'], format: date }
        pointsPerClass: { type: integer }
        pointsPerPractice: { type: integer }

    KungFuProfileWithMember:
      description: A `KungFuProfile` tagged with the family member it belongs to.
      allOf:
        - $ref: '#/components/schemas/KungFuProfile'
        - type: object
          required: [userId]
          properties:
            userId: { type: string, format: uuid }
            name: { type: [string, 'null'] }

    KungFuLog:
      type: object
      description: >-
        One training log entry. `pointsEarned` is snapshotted from the
        profile's per-type point value at the moment it was logged.
      required: [id, sessionType, pointsEarned, loggedAt]
      properties:
        id: { type: string, format: uuid }
        sessionType: { type: string, enum: [class, practice] }
        pointsEarned: { type: integer }
        loggedAt: { type: string, format: date-time }

    # ---------------- Quests (hand-rolled schema, migration 022) ----------------
    Quest:
      type: object
      description: >-
        One of today's 3 assigned quests. `key` names which section it maps
        to; `done` is computed live against that section's own table, not
        stored.
      required: [key, label, done]
      properties:
        key:
          type: string
          enum: [chore, habit, homework, reading, kungfu, trivia, mood, gujarati]
        label: { type: string }
        done: { type: boolean }

    # ---------------- Rewards (hand-rolled schema, migration 023) ----------------
    RewardSettings:
      type: object
      description: Per-user weekly points goal. Missing rows default to 50.
      required: [weeklyGoal]
      properties:
        weeklyGoal: { type: integer }

    RewardSettingsWithMember:
      description: A `RewardSettings` tagged with the family member it belongs to.
      allOf:
        - $ref: '#/components/schemas/RewardSettings'
        - type: object
          required: [userId]
          properties:
            userId: { type: string, format: uuid }
            name: { type: [string, 'null'] }

    RewardLibraryItem:
      type: object
      description: >-
        One item in a family's reward catalog. `cashAmount` is null for a
        non-cash reward. Retired items (`active: false`) are never deleted —
        earned rewards may still reference them.
      required: [id, title, active]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        cashAmount: { type: [number, 'null'] }
        active: { type: boolean }

    RewardEarned:
      type: object
      description: >-
        One milestone crossed (a weekly-goal hit, or a monthly tier reached).
        `libraryItem` and `fulfilledAt` are null until a parent fulfills it.
      required: [id, userId, milestoneType, periodKey, earnedAt, fulfilledAt, libraryItem, fulfillmentNote]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        assigneeName: { type: [string, 'null'] }
        milestoneType: { type: string, enum: [weekly, bronze, silver, gold] }
        periodKey: { type: string }
        earnedAt: { type: string, format: date-time }
        fulfilledAt: { type: [string, 'null'], format: date-time }
        libraryItem:
          oneOf:
            - { $ref: '#/components/schemas/RewardLibraryItem' }
            - { type: 'null' }
        fulfillmentNote: { type: [string, 'null'] }

    # ---------------- Habits + mood (hand-rolled schema, migration 013) ----------------
    Habit:
      type: object
      description: >-
        From HabitService's raw-Postgres `habits` table (migration 013) — NOT
        the Supabase-era `habits` shape in types/database.ts. user_id is the
        assignee; weekly_target is the "N of 7 days this week" goal.
      required: [id, userId, title, weeklyTarget, pointsValue, enabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        weeklyTarget: { type: integer, minimum: 1, maximum: 7 }
        pointsValue: { type: integer }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HabitWithStatus:
      description: >-
        A `Habit` plus this week's progress — what `GET /api/habits` returns.
        `weekCompletions` counts the family-local current week (Mon–Sun);
        `completedToday` / `completionId` reflect today; `weekStreak` is
        consecutive weeks that met `weeklyTarget`.
      allOf:
        - $ref: '#/components/schemas/Habit'
        - type: object
          required: [weekCompletions, completedToday, weekStreak]
          properties:
            assigneeName: { type: [string, 'null'] }
            weekCompletions: { type: integer }
            completedToday: { type: boolean }
            completionId: { type: [string, 'null'], format: uuid }
            weekStreak: { type: integer }

    MoodEntry:
      type: object
      required: [id, userId, mood, recordedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        mood: { type: string, enum: [great, good, ok, low, sad] }
        emoji: { type: string }
        note: { type: string }
        recordedAt: { type: string, format: date-time }

    MoodDay:
      type: object
      description: One member's mood for one family-local day — the FR-149 heatmap unit.
      required: [userId, day, mood]
      properties:
        userId: { type: string, format: uuid }
        assigneeName: { type: [string, 'null'] }
        day: { type: string, format: date }
        mood: { type: string, enum: [great, good, ok, low, sad] }
        emoji: { type: [string, 'null'] }

    # ---------------- Kids board — routines (hand-rolled schema, migration 015) ----------------
    Routine:
      type: object
      description: >-
        A single morning/evening routine-checklist item for a young child (T-12).
        `userId` is whose routine. No points, no streak — deliberately its own
        table, not `habits`.
      required: [id, userId, slot, label, emoji, sortOrder, enabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        slot: { type: string, enum: [morning, evening] }
        label: { type: string }
        emoji: { type: string }
        sortOrder: { type: integer }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RoutineWithStatus:
      description: A `Routine` plus whether it's been ticked off for the child's family-local today.
      allOf:
        - $ref: '#/components/schemas/Routine'
        - type: object
          required: [doneToday]
          properties:
            doneToday: { type: boolean }

    # ---------------- Kiosk (T-14, migration 016) ----------------
    KioskDevice:
      type: object
      description: A registered wall display, safe to list back to a parent (never the token).
      required: [id, label, lastSeenAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    KioskProfile:
      type: object
      description: One family member as shown on the kiosk profile picker.
      required: [userId, name, role, color]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }
        color: { type: [string, 'null'] }

    KioskBootstrap:
      type: object
      description: The payload a wall display boots with — no user login involved.
      required: [family, members, hasPin, idleMinutes]
      properties:
        family:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        members: { type: array, items: { $ref: '#/components/schemas/KioskProfile' } }
        hasPin: { type: boolean }
        idleMinutes: { type: integer }

    # ---------------- Learning (hand-rolled schema) ----------------
    LessonContent:
      type: object
      description: Normalised lesson body — `text` is the Gujarati glyph/word.
      required: [text, romanization, pronunciation, english]
      properties:
        text: { type: string }
        romanization: { type: string }
        pronunciation: { type: string }
        english: { type: string }
        word: { type: string, description: "Gujarati spelled-out word (numbers only)." }

    Lesson:
      type: object
      description: A `learning_lessons` row (seeded from seed-data/gujarati-curriculum.json).
      required: [id, category, phase, subcategory, sequenceOrder, content, pointsValue]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [alphabet, numbers, vocabulary] }
        phase: { type: string, enum: [phase_1_alphabet, phase_2_numbers, phase_3_vocabulary] }
        subcategory: { type: string, description: "vowels / consonants / digits / animals / family / …" }
        sequenceOrder: { type: integer }
        content: { $ref: '#/components/schemas/LessonContent' }
        pointsValue: { type: integer }

    LessonWithProgress:
      description: A `Lesson` plus this user's completion of it.
      allOf:
        - $ref: '#/components/schemas/Lesson'
        - type: object
          required: [completed, pointsEarned, traced]
          properties:
            completed: { type: boolean }
            pointsEarned: { type: integer }
            traced:
              type: boolean
              description: T-25 — has this lesson had a successful trace-mode session, ever.

    LearningProgressEntry:
      type: object
      description: |
        From `LearningService`'s raw-Postgres `learning_progress` table —
        NOT the Supabase `learning_progress` table in `types/database.ts`
        (different columns: course_id/current_lesson_id/completion_percentage
        vs. this feature's lesson_id/category/phase/completed).
      required: [id, userId, lessonId, category, phase, completed, pointsEarned, traced, tracePointsEarned, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        lessonId: { type: string }
        category: { type: string, enum: [alphabet, numbers, vocabulary] }
        phase: { type: string }
        completed: { type: boolean }
        pointsEarned: { type: integer }
        completedAt: { type: string, format: date-time }
        traced:
          type: boolean
          description: T-25 — set on the first successful trace-mode session.
        tracePointsEarned:
          type: integer
          description: Awarded once, ever (0 until the first successful trace).
        tracedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PhaseProgress:
      type: object
      properties:
        totalLessons: { type: integer }
        completedLessons: { type: integer }
        percentComplete: { type: integer, description: "0-100, rounded" }
        pointsEarned: { type: integer }

    LearningStats:
      type: object
      properties:
        totalLessonsCompleted: { type: integer }
        totalPointsEarned: { type: integer }
        alphabet: { type: object, properties: { completed: { type: integer }, total: { type: integer } } }
        numbers: { type: object, properties: { completed: { type: integer }, total: { type: integer } } }
        vocabulary: { type: object, properties: { completed: { type: integer }, total: { type: integer } } }

    # ---------------- Trivia (T-09, migration 018) ----------------
    TriviaQuestion:
      type: object
      description: The daily question as shown — four options, no answer key.
      required: [id, question, category, difficulty, options, hint, pointsValue]
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        category: { type: string }
        difficulty: { type: string, enum: [easy, medium, hard] }
        options: { type: array, items: { type: string }, minItems: 4, maxItems: 4 }
        hint: { type: [string, 'null'] }
        pointsValue: { type: integer }

    TriviaAttempt:
      type: object
      description: This user's answer for today (present only once they've answered).
      required: [selectedAnswer, isCorrect, pointsEarned, correctAnswer]
      properties:
        selectedAnswer: { type: string }
        isCorrect: { type: boolean }
        pointsEarned: { type: integer }
        correctAnswer: { type: string }
        funFact: { type: [string, 'null'] }

    TriviaToday:
      type: object
      required: [question, attempt, streak, stats]
      properties:
        question:
          oneOf:
            - $ref: '#/components/schemas/TriviaQuestion'
            - type: 'null'
        attempt:
          oneOf:
            - $ref: '#/components/schemas/TriviaAttempt'
            - type: 'null'
        streak: { type: integer, description: Consecutive family-local days ending today with an attempt. }
        stats:
          type: object
          required: [answered, correct]
          properties:
            answered: { type: integer }
            correct: { type: integer }

    # ---------------- Announcements ----------------
    Announcement:
      type: object
      description: Raw `announcements` table row (Tables<'announcements'>['Row']).
      required: [id, family_id, created_by_id, title, message]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: [string, 'null'], format: uuid }
        created_by_id: { type: string, format: uuid }
        title: { type: string }
        message: { type: string }
        announcement_type: { type: [string, 'null'] }
        priority: { type: [string, 'null'] }
        target_audience: { type: [string, 'null'] }
        target_user_ids: { type: [array, 'null'], items: { type: string } }
        is_pinned: { type: [boolean, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    AnnouncementWithReadStatus:
      allOf:
        - $ref: '#/components/schemas/Announcement'
        - type: object
          required: [is_read, reader_count]
          properties:
            is_read: { type: boolean }
            reader_count: { type: integer, description: "Currently always 0 — marked TODO in source, not yet implemented." }

    # ---------------- Shopping ----------------
    ShoppingItem:
      type: object
      description: Raw `shopping_items` table row (migration 009).
      required: [id, family_id, name, checked]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        name: { type: string }
        checked: { type: boolean }
        added_by_id: { type: [string, 'null'], format: uuid }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    # ---------------- Meals ----------------
    MealPlanEntry:
      type: object
      description: One meal-plan slot row (migration 010). `plan_date` is a real calendar date, `YYYY-MM-DD`.
      required: [id, family_id, plan_date, slot, text]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        plan_date: { type: string, format: date }
        slot: { type: string, enum: [breakfast, lunch, dinner, snack] }
        text: { type: string }
        updated_by_id: { type: [string, 'null'], format: uuid }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    MealLibraryItem:
      type: object
      description: One saved meal in the family library (migration 011, FR-133).
      required: [id, family_id, name]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        name: { type: string }
        default_slot: { type: [string, 'null'], enum: [breakfast, lunch, dinner, snack, null] }
        created_by_id: { type: [string, 'null'], format: uuid }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    # ---------------- Reminders ----------------
    Reminder:
      type: object
      description: >-
        A `reminders` table row plus `assignee_name` (the joined display name of
        `user_id`). Reminders are family-scoped: `family_id` is the visibility
        scope and `user_id` is the assignee ("whose reminder").
      required: [id, user_id, title, reminder_type, scheduled_time]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        family_id: { type: [string, 'null'], format: uuid }
        assignee_name:
          type: [string, 'null']
          description: Display name of `user_id`; present on the family-scoped read/write views, not a stored column.
        title: { type: string }
        description: { type: [string, 'null'] }
        reminder_type: { type: string, enum: [chore, assignment, event, goal, custom] }
        related_item_id: { type: [string, 'null'] }
        related_item_type: { type: [string, 'null'] }
        scheduled_time: { type: string, format: date-time }
        remind_before_minutes: { type: [integer, 'null'] }
        recurrence: { type: [string, 'null'], enum: [once, daily, weekly, monthly, null] }
        recurrence_end_date: { type: [string, 'null'], format: date-time }
        is_dismissed: { type: [boolean, 'null'] }
        dismissed_at: { type: [string, 'null'], format: date-time }
        notification_sent: { type: [boolean, 'null'] }
        sent_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    # ---------------- Energy ----------------
    EnergyUsage:
      type: object
      description: Raw `energy_usage` table row (Tables<'energy_usage'>['Row']).
      required: [id, device_id, timestamp]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string }
        device_name: { type: [string, 'null'] }
        device_type: { type: [string, 'null'] }
        power_watts: { type: [number, 'null'] }
        energy_kwh: { type: [number, 'null'] }
        timestamp: { type: string, format: date-time }
        recorded_at: { type: [string, 'null'], format: date-time }

    EnergySummaryRow:
      type: object
      description: Raw `energy_summary` table row (Tables<'energy_summary'>['Row']).
      required: [id, period, period_start, period_end]
      properties:
        id: { type: string, format: uuid }
        period: { type: string, enum: [daily, weekly, monthly] }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        total_kwh: { type: [number, 'null'] }
        average_power_watts: { type: [number, 'null'] }
        peak_power_watts: { type: [number, 'null'] }
        peak_time: { type: [string, 'null'], format: date-time }
        device_count: { type: [integer, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    EnergyGoal:
      type: object
      description: Raw `energy_goals` table row (Tables<'energy_goals'>['Row']).
      required: [id, created_by_id, goal_type, start_date, end_date]
      properties:
        id: { type: string, format: uuid }
        created_by_id: { type: string, format: uuid }
        goal_type: { type: string, enum: [daily, weekly, monthly] }
        target_kwh: { type: [number, 'null'] }
        current_kwh: { type: [number, 'null'] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: [string, 'null'], description: "GET /api/energy/goals filters status = 'active'." }
        points_reward: { type: [integer, 'null'] }
        achieved_at: { type: [string, 'null'], format: date-time }

    WaterUsageSummary:
      type: object
      description: The water usage dashboard card's whole read model, from `WaterSmartService.getUsageSummary`.
      required: [configured, lastSyncedAt, latestReadingAt, dailyTotals, leakDetected]
      properties:
        configured:
          type: boolean
          description: False when WATERSMART_HOSTNAME/EMAIL/PASSWORD aren't all set — every other field is then a placeholder (null / empty).
        lastSyncedAt: { type: [string, 'null'], format: date-time, description: When a poll last wrote a row (success or not, this only reflects writes). }
        latestReadingAt: { type: [string, 'null'], format: date-time, description: WaterSmart's own most recent meter reading timestamp — this lags real time, often by a day or more. }
        dailyTotals:
          type: array
          description: Up to the last 8 days with data, oldest first.
          items:
            type: object
            required: [date, gallons]
            properties:
              date: { type: string, format: date }
              gallons: { type: number }
        leakDetected:
          type: boolean
          description: True when any reading in the last 2 days carried a nonzero leak_gallons flag.

    MaintenanceItem:
      type: object
      description: One row from `maintenance_items`, from `MaintenanceService.getItems` -- next due date and days-until-due are always computed, never stored.
      required: [id, name, intervalDays, lastDoneAt, nextDueAt, daysUntilDue]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        intervalDays: { type: integer }
        lastDoneAt: { type: string, format: date }
        nextDueAt: { type: string, format: date, description: lastDoneAt + intervalDays. }
        daysUntilDue:
          type: integer
          description: Negative when overdue (days past nextDueAt).

    # ---------------- Calendar ----------------
    CalendarEvent:
      type: object
      description: Raw `calendar_events` table row (Tables<'calendar_events'>['Row']).
      required: [id, family_id, created_by_id, event_title, event_date]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        created_by_id: { type: string, format: uuid }
        event_title: { type: string }
        event_description: { type: [string, 'null'] }
        event_type: { type: [string, 'null'] }
        event_date: { type: string, format: date }
        start_time: { type: [string, 'null'] }
        end_time: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    GoogleCalendarEvent:
      type: object
      description: Passthrough (lightly typed) of Google Calendar API event objects, plus calendar metadata attached by the service.
      properties:
        id: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        start:
          type: [object, 'null']
          properties:
            dateTime: { type: [string, 'null'] }
            date: { type: [string, 'null'] }
        end:
          type: [object, 'null']
          properties:
            dateTime: { type: [string, 'null'] }
            date: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        recurringEventId: { type: [string, 'null'], description: "Set on an expanded instance of a recurring event (singleEvents:true) — the id of the series master. FR-126 dismisses a whole series by this id." }
        attendees:
          type: [array, 'null']
          items: { type: object, properties: { email: { type: string } } }
        calendarId: { type: string, description: "Attached by the service; identifies which of the user's Google calendars this event came from." }
        calendarName: { type: string }
        calendarColor: { type: string }

    GoogleCalendarEventInput:
      type: object
      description: >
        Body for creating/updating a Google Calendar event from the dashboard
        form. Wall-clock date/time parts are kept separate from the timezone,
        matching how Google's API wants a timed event ({ dateTime, timeZone }).
      required: [summary, startDate, timeZone]
      properties:
        summary: { type: string, description: "Event title. Required, non-empty." }
        description: { type: string }
        location: { type: string }
        allDay: { type: boolean, default: false }
        startDate: { type: string, format: date, description: "YYYY-MM-DD." }
        startTime: { type: string, pattern: '^\d{2}:\d{2}$', description: "HH:MM. Required when allDay is false." }
        endDate: { type: string, format: date, description: "YYYY-MM-DD. Defaults to startDate. For an all-day event this is the last day (the API's exclusive end is computed server-side)." }
        endTime: { type: string, pattern: '^\d{2}:\d{2}$', description: "HH:MM. Defaults to startTime + 1 hour." }
        timeZone: { type: string, description: "IANA timezone, e.g. America/New_York." }
        attendees:
          type: array
          items: { type: string, format: email }
          description: "Attendee email addresses. Each is validated for shape."
        sendInvites: { type: boolean, default: true, description: "false → sendUpdates: none (no invite/update/cancellation emails)." }
        calendarId: { type: string, default: primary, description: "Reserved for a future calendar picker; only 'primary' is used today." }

    EventPerson:
      type: object
      description: >
        Raw `event_people` table row (migration 007, FR-153). One family member's
        Going/Maybe assignment to an event.
      required: [id, family_id, event_id, family_member_id, role]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        event_id: { type: string, description: "Google event id, or a local calendar_events UUID as text." }
        family_member_id: { type: string, format: uuid }
        role: { type: string, enum: [going, maybe] }
        created_at: { type: [string, 'null'], format: date-time }

    EventPeopleInput:
      type: object
      description: "Body for PUT /api/calendar/events/{eventId}/people — the full desired set of assignments (replace-all)."
      required: [people]
      properties:
        people:
          type: array
          items:
            type: object
            required: [familyMemberId, role]
            properties:
              familyMemberId: { type: string, format: uuid }
              role: { type: string, enum: [going, maybe] }

    # ---------------- Family ----------------
    Family:
      type: object
      description: Raw `families` table row (Tables<'families'>['Row']).
      required: [id, created_by_id, name]
      properties:
        id: { type: string, format: uuid }
        created_by_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        max_children: { type: [integer, 'null'] }
        max_parents: { type: [integer, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    FamilyMember:
      type: object
      description: >-
        A `family_members` table row, plus the member's `name` and `email` from
        the joined `users` row (both null for a member with no linked user).
      required: [id, family_id, user_id, role]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [admin, parent, child, guardian] }
        invited_by_id: { type: [string, 'null'], format: uuid }
        is_active: { type: [boolean, 'null'] }
        joined_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        color:
          type: [string, 'null']
          description: "Calendar colour key (migration 006); null until a parent assigns one."

    FamilyWithMembers:
      allOf:
        - $ref: '#/components/schemas/Family'
        - type: object
          required: [member_count, members]
          properties:
            member_count: { type: integer }
            members:
              type: array
              items: { $ref: '#/components/schemas/FamilyMember' }

    FamilySettings:
      type: object
      description: Raw `family_settings` table row (Tables<'family_settings'>['Row']).
      required: [id, family_id]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        theme: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        notifications_enabled: { type: [boolean, 'null'] }
        sound_notifications: { type: [boolean, 'null'] }
        email_digest_frequency: { type: [string, 'null'] }
        parental_controls_enabled: { type: [boolean, 'null'] }
        require_age_verification: { type: [boolean, 'null'] }
        max_screen_time_minutes: { type: [integer, 'null'] }
        bedtime_enabled: { type: [boolean, 'null'] }
        bedtime_start: { type: [string, 'null'] }
        bedtime_end: { type: [string, 'null'] }
        enable_smart_home_control: { type: [boolean, 'null'] }
        points_system_enabled: { type: [boolean, 'null'] }
        badges_system_enabled: { type: [boolean, 'null'] }
        leaderboard_enabled: { type: [boolean, 'null'] }
        privacy_mode: { type: [boolean, 'null'] }
        allow_google_calendar_sync: { type: [boolean, 'null'] }
        kiosk_idle_minutes: { type: [integer, 'null'], description: "Minutes of inactivity before a shared display reverts to the household overview (T-14). Default 5." }
        has_pin: { type: boolean, description: "Whether a family PIN is set (T-14). Derived server-side; the hash itself is never sent to the client." }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    FamilySettingsUpdatable:
      type: object
      description: Only these columns are actually applied by PATCH /api/family/settings (whitelist enforced server-side); any other keys in the request body are silently dropped.
      properties:
        theme: { type: string }
        language: { type: string }
        timezone: { type: string }
        notifications_enabled: { type: boolean }
        sound_notifications: { type: boolean }
        email_digest_frequency: { type: string }
        parental_controls_enabled: { type: boolean }
        require_age_verification: { type: boolean }
        max_screen_time_minutes: { type: integer }
        bedtime_enabled: { type: boolean }
        bedtime_start: { type: string }
        bedtime_end: { type: string }
        enable_smart_home_control: { type: boolean }
        points_system_enabled: { type: boolean }
        badges_system_enabled: { type: boolean }
        leaderboard_enabled: { type: boolean }
        privacy_mode: { type: boolean }
        allow_google_calendar_sync: { type: boolean }
        kiosk_idle_minutes: { type: integer, minimum: 1, maximum: 120 }

    # ---------------- Activity Log ----------------
    ActivityLogEntry:
      type: object
      description: Raw `activity_log` table row (Tables<'activity_log'>['Row']).
      required: [id, user_id, activity_type, action]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        activity_type: { type: string }
        action: { type: string }
        points_earned: { type: [integer, 'null'] }
        achievement_title: { type: [string, 'null'] }
        related_item_id: { type: [string, 'null'] }
        related_item_type: { type: [string, 'null'] }
        metadata: { type: [object, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    # ---------------- External APIs ----------------
    WordDefinition:
      type: object
      properties:
        word: { type: string }
        partOfSpeech: { type: string }
        definition: { type: string }
        example: { type: string }
        synonym: { type: string }

    WordResponse:
      type: object
      properties:
        word: { type: string }
        definitions:
          type: array
          items: { $ref: '#/components/schemas/WordDefinition' }
        pronunciation: { type: string }
        audioUrl: { type: string }

    WeatherData:
      type: object
      properties:
        location: { type: string }
        temperature: { type: number, description: "Rounded. Unit follows the request's ?units — °F by default, °C when units=metric." }
        feelsLike: { type: number, description: "Same unit as temperature." }
        humidity: { type: number, description: "Percent." }
        windSpeed: { type: number, description: "mph by default, m/s when units=metric." }
        description: { type: string }
        icon: { type: string, description: "An emoji character, not an icon code/URL." }
        timestamp: { type: string, format: date-time }
        sunrise: { type: string, format: date-time }
        sunset: { type: string, format: date-time }

    ForecastItem:
      type: object
      properties:
        date: { type: string, description: "Locale date string (toLocaleDateString()), not ISO 8601." }
        high: { type: number }
        low: { type: number }
        description: { type: string }
        icon: { type: string }
        precipChance: { type: integer, description: "0-100" }
