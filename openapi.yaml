  /api/calendar/auth/google:
    get:
      tags: [Calendar]
      summary: Get Google OAuth authorization URL, or report already-connected
      description: "userId may come from x-user-id header OR a userId query param (the only endpoint in this route file that accepts either)."
      operationId: getGoogleAuthUrl
      security: [{ userIdHeader: [] }]
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "Alternative to the x-user-id header."
      responses:
        '200':
          description: Connection status / auth URL.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          connected: { type: boolean }
                          email:
                            type: [string, 'null']
                            format: email
                            description: "The connected Google account's primary-calendar address (FR-124); null when not connected or unreadable."
                          authUrl: { type: [string, 'null'] }
        '401':
          description: Missing user ID.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/auth/google/callback:
    get:
      tags: [Calendar]
      summary: Google OAuth callback (redirect, not JSON)
      description: |
        On success or failure, this always issues a 302 redirect back to
        `${FRONTEND_URL}/dashboard` with a `googleAuth=success` or
        `googleAuth=error&message=...` query param — it never returns a JSON
        body. Also reachable via the legacy alias `GET /auth/google/callback`
        (registered directly in `server.ts`), which itself just 302-redirects
        to this path with the query string preserved.
      operationId: googleOAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string, description: "The user ID, passed through as OAuth state." }
      responses:
        '302':
          description: Redirect to frontend dashboard with googleAuth=success|error.
          headers:
            Location:
              schema: { type: string }
        '400':
          description: Missing code or state (JSON, not a redirect, in this one case).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /auth/google/callback:
    get:
      tags: [Calendar]
      summary: Legacy OAuth callback alias (redirect shim only)
      description: "Registered directly in server.ts. Immediately 302-redirects to /api/calendar/auth/google/callback with the query string forwarded unchanged. Exists for backwards compatibility with a previously-registered Google OAuth redirect URI."
      operationId: legacyGoogleOAuthCallbackAlias
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to /api/calendar/auth/google/callback.
          headers:
            Location:
              schema: { type: string }

  /api/calendar/google/events:
    get:
      tags: [Calendar]
      summary: Fetch the user's Google Calendar events (across all their Google calendars)
      operationId: getGoogleCalendarEvents
      security: [{ userIdHeader: [] }]
      parameters:
        - name: timeMin
          in: query
          schema: { type: string, format: date-time, description: "Defaults to start of current week (Monday) if omitted." }
        - name: timeMax
          in: query
          schema: { type: string, format: date-time }
        - name: maxResults
          in: query
          schema: { type: integer, default: 250 }
      responses:
        '200':
          description: Events from Google Calendar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GoogleCalendarEvent' }
                  count: { type: integer }
                  source: { type: string, const: google_calendar }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id, or Google authorization expired/revoked with no refresh token (code TOKEN_REFRESH_FAILED or NO_REFRESH_TOKEN).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: error }
                  code: { type: string }
                  message: { type: string }
                  error: { type: string }
        '500':
          description: Unexpected failure (status code passed through from a thrown error's `status` field when present, defaulting to 500).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    post:
      tags: [Calendar]
      summary: Create an event on the caller's Google Calendar (B-lite, parents only)
      description: >
        Writes the event to the caller's Google Calendar (`primary` for now) via
        `events.insert`, then mirrors it into `calendar_events` tagged with its
        `google_event_id` so family members who aren't attendees still see it.
        Google is the source of truth — the mirror row is never edited by hand.
        The mirror write is best-effort: a failure leaves `mirrorId` null but the
        request still succeeds because the event exists in Google. Restricted to
        family members with role `parent` or `admin`.
      operationId: createGoogleCalendarEvent
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleCalendarEventInput' }
      responses:
        '201':
          description: Created in Google (and, best-effort, mirrored locally).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/GoogleCalendarEvent'
                      - type: object
                        properties:
                          google_event_id: { type: string }
                          google_calendar_id: { type: string }
                          mirrorId: { type: [string, 'null'], description: "calendar_events row id, or null if the mirror write failed." }
                  timestamp: { type: string, format: date-time }
        '400':
          description: Invalid body (missing summary, bad date/time format, invalid attendee email, etc.).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id, or Google isn't connected / authorization expired (code NO_TOKEN, TOKEN_REFRESH_FAILED, NO_REFRESH_TOKEN).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin in their family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: Caller has no family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure (upstream Google status passed through when present).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/google/disconnect:
    post:
      tags: [Calendar]
      summary: Disconnect Google Calendar
      description: "Best-effort token revoke with Google (failure is logged but does not block); always marks the local integration inactive."
      operationId: disconnectGoogleCalendar
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: Disconnected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Google Calendar disconnected successfully" }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/dismissed:
    get:
      tags: [Calendar]
      summary: List event IDs the user has dismissed from view
      operationId: listDismissedEvents
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: Dismissed events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id: { type: string }
                        calendar_id: { type: [string, 'null'] }
                        dismissed_at: { type: string, format: date-time }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/dismissed/{eventId}:
    delete:
      tags: [Calendar]
      summary: Restore a dismissed event (undo a hide; re-accepts in Google when applicable)
      description: >
        Removes the local hide. When `source=google` and the user had declined
        the invite, best-effort flips their Google RSVP back to `accepted`
        (FR-127). `calendarId` / `source` may be given as query params or in the
        request body.
      operationId: restoreDismissedEvent
      security: [{ userIdHeader: [] }]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
        - name: calendarId
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string, enum: [google, local] }
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    type: object
                    properties:
                      local: { type: boolean }
                      synced: { type: boolean }
                      action: { type: string, enum: [accepted] }
                      reason: { type: string }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/events/{id}/dismiss:
    post:
      tags: [Calendar]
      summary: Dismiss an event from the calendar view (local hide + Google decline when invited)
      description: >
        Always records a local hide so the event stays out of this user's Family
        Hub calendar. When `source` is `google` and the connected user is an
        attendee of the event, also sets their RSVP to `declined` in Google
        Calendar (requires the `calendar.events` OAuth scope — a token predating
        it yields `reason: reconnect_required`).
      operationId: dismissCalendarEvent
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: "Local event UUID or Google event ID." }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                calendarId: { type: string, description: "Google calendar ID, when dismissing a Google event." }
                source:
                  type: string
                  enum: [google, local]
                  description: "Origin of the event. `google` enables the two-way decline; anything else is a local hide only."
      responses:
        '200':
          description: Dismissed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Event dismissed successfully" }
                  data:
                    type: object
                    properties:
                      local: { type: boolean, const: true }
                      synced: { type: boolean, description: "True only when the invite was declined in Google." }
                      action: { type: string, enum: [declined] }
                      reason:
                        type: string
                        enum: [no_token, not_an_attendee, reconnect_required, google_error]
                        description: "Why the Google decline didn't happen (absent on success)."
                  timestamp: { type: string, format: date-time }
        '400':
          description: Missing event ID.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/google/events/{id}:
    patch:
      tags: [Calendar]
      summary: Update a feature-created Google event (creator only)
      description: >
        Patches the Google event and refreshes its `calendar_events` mirror row.
        Only events that were created through this feature (i.e. have a mirror row
        carrying the `google_event_id`) can be edited, and only by the user who
        created them. If Google reports the event gone, the stale mirror row is
        dropped and a 404 is returned.
      operationId: updateGoogleCalendarEvent
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: "The Google event id." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleCalendarEventInput' }
      responses:
        '200':
          description: Updated in Google and in the local mirror.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/GoogleCalendarEvent'
                      - type: object
                        properties:
                          google_event_id: { type: string }
                          google_calendar_id: { type: string }
                          mirrorId: { type: [string, 'null'] }
                  timestamp: { type: string, format: date-time }
        '400':
          description: Invalid body.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id, or Google authorization expired.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin, or not the event's creator.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No feature-created event with that id, the caller has no family, or Google reports the event no longer exists.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    delete:
      tags: [Calendar]
      summary: Delete a feature-created Google event (creator only)
      description: >
        Deletes the Google event and drops its `calendar_events` mirror row. Only
        the creating user can delete. A Google 404/410 (already gone upstream) is
        treated as success — `data.alreadyGone` reports which happened.
      operationId: deleteGoogleCalendarEvent
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: "The Google event id." }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sendInvites: { type: boolean, default: true, description: "false → sendUpdates: none (no cancellation emails to attendees)." }
      responses:
        '200':
          description: Deleted (or already gone upstream).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      alreadyGone: { type: boolean, description: "True when Google reported the event already deleted." }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id, or Google authorization expired.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin, or not the event's creator.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No feature-created event with that id, or the caller has no family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  # ================================================================
  # FAMILY
  # ================================================================
  /api/family:
    get:
      tags: [Family]
      summary: Get the authenticated user's family (with member list)
      operationId: getMyFamily
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: Family.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FamilyWithMembers' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No family found for user.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    post:
      tags: [Family]
      summary: Create a new family (caller becomes admin member)
      operationId: createFamily
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                max_children: { type: integer, default: 5 }
                max_parents: { type: integer, default: 2 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Family' }
        '400':
          description: Missing name.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/family/members:
    get:
      tags: [Family]
      summary: List all active members of the caller's family
      operationId: listFamilyMembers
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/FamilyMember' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No family found.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/family/members/invite:
    post:
      tags: [Family]
      summary: Invite a member to the family by email (7-day token)
      operationId: inviteFamilyMember
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, parent, child, guardian] }
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invite_token: { type: string }
                          email: { type: string }
                          role: { type: string }
                          expires_in: { type: string, const: "7 days" }
        '400':
          description: Missing email or role.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No family found.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/family/children:
    post:
      tags: [Family]
      summary: Parent-provisioned child account creation (COPPA compliance)
      description: |
        Only an existing parent/admin member of a family may call this
        (403 otherwise). This is the only legitimate way to create a child
        account — `POST /auth/signup` rejects `role: 'child'` outright.
      operationId: createChildAccount
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, birth_year]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                birth_year: { type: integer, description: "Must correspond to age 0-17." }
      responses:
        '201':
          description: Child account created and added to family.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string }
                          name: { type: string }
                          email: { type: string }
                          role: { type: string, const: child }
                          is_under_13: { type: boolean }
        '400':
          description: Missing/invalid fields, invalid birth_year, or Supabase auth create failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin of the family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: Caller has no family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/family/members/accept-invitation:
    post:
      tags: [Family]
      summary: Accept a family invitation by token
      operationId: acceptFamilyInvitation
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token]
              properties:
                invite_token: { type: string }
      responses:
        '200':
          description: Joined family.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FamilyMember' }
        '400':
          description: "Missing invite_token, invalid/expired invitation (this handler returns 400 for ALL failures including unexpected ones, not just validation errors)."
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/family/members/{memberId}/role:
    patch:
      tags: [Family]
      summary: Update a family member's role
      operationId: updateFamilyMemberRole
      security: [{ userIdHeader: [] }]
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FamilyMember' }
        '400':
          description: Missing role.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No family found.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/family/members/{memberId}/color:
    patch:
      tags: [Family]
      summary: Set or clear a family member's calendar colour key
      description: >
        `memberId` is the member's user_id (same as the role endpoint).
        `color` is one of krish, karishma, priya, anand, dada, maa, all — or
        null to clear it. Parents/admins only.
      operationId: updateFamilyMemberColor
      security: [{ userIdHeader: [] }]
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color]
              properties:
                color:
                  type: [string, 'null']
                  enum: [krish, karishma, priya, anand, dada, maa, all, null]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FamilyMember' }
        '400':
          description: Invalid colour key.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No family found.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/family/members/{memberId}:
    delete:
      tags: [Family]
      summary: Remove (soft-deactivate) a member from the family
      operationId: removeFamilyMember
      security: [{ userIdHeader: [] }]
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Member removed from family" }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No family found.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/family/settings:
    get:
      tags: [Family]
      summary: Get family settings
      operationId: getFamilySettings
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FamilySettings' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No family found.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    patch:
      tags: [Family]
      summary: Update family settings
      description: "Request body is passed through with only a column-name whitelist (no other validation); non-whitelisted keys are silently dropped."
      operationId: updateFamilySettings
      security: [{ userIdHeader: [] }]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilySettingsUpdatable'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FamilySettings' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No family found.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  # ================================================================
  # ACTIVITY LOG
  # ================================================================
  /api/activity/feed:
    get:
      tags: [ActivityLog]
      summary: Get the authenticated user's activity feed
      operationId: getActivityFeed
      security: [{ userIdHeader: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Activity feed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ActivityLogEntry' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/activity/family-feed:
    get:
      tags: [ActivityLog]
      summary: Get the activity feed for the caller's whole family
      operationId: getFamilyActivityFeed
      security: [{ userIdHeader: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Family activity feed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ActivityLogEntry' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: User not in a family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/activity/log:
    post:
      tags: [ActivityLog]
      summary: Log an activity entry
      description: "No auth check in this handler at all (not even x-user-id) — the target user is taken from the request body's `user_id` field, so any caller can log activity for any user."
      operationId: logActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, activity_type, action]
              properties:
                user_id: { type: string, format: uuid }
                activity_type: { type: string }
                action: { type: string }
                points_earned: { type: integer, default: 0 }
                achievement_title: { type: string }
                related_item_id: { type: string }
                related_item_type: { type: string }
                metadata: { type: object }
      responses:
        '201':
          description: Logged.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ActivityLogEntry' }
        '400':
          description: Missing required fields.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/activity/stats:
    get:
      tags: [ActivityLog]
      summary: Get activity-type counts over a trailing window
      operationId: getActivityStats
      security: [{ userIdHeader: [] }]
      parameters:
        - name: daysBack
          in: query
          schema: { type: integer, default: 7 }
      responses:
        '200':
          description: "Map of activity_type -> count."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { type: integer }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  # ================================================================
  # EXTERNAL APIS (Bearer)
  # ================================================================
  /api/external/dictionary/word/{word}:
    get:
      tags: [ExternalAPIs]
      summary: Get a word definition (Merriam-Webster, cached 7 days)
      operationId: getWordDefinition
      security: [{ bearerAuth: [] }]
      parameters:
        - name: word
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WordResponse' }
        '400':
          description: Empty word parameter.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '404':
          description: No definition found.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '401':
          description: Missing authorization header.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }

  /api/external/dictionary/word-of-day:
    get:
      tags: [ExternalAPIs]
      summary: Get word of the day (cached 24h)
      operationId: getWordOfTheDay
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Word of the day.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WordResponse'
                  - type: object
                    properties:
                      message: { type: string, const: "Word of the Day" }
        '503':
          description: Unable to fetch word of the day.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '401':
          description: Missing authorization header.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }

  /api/external/dictionary/search:
    get:
      tags: [ExternalAPIs]
      summary: Search words by prefix (cached 24h)
      operationId: searchWords
      security: [{ bearerAuth: [] }]
      parameters:
        - name: prefix
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Matching words.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prefix: { type: string }
                  count: { type: integer }
                  words: { type: array, items: { type: string } }
        '400':
          description: Prefix too short.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '401':
          description: Missing authorization header.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }

