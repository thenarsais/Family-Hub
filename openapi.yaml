        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color]
              properties:
                color:
                  type: [string, 'null']
                  enum: [krish, karishma, priya, anand, dada, maa, all, null]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FamilyMember' }
        '400':
