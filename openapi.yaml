  /api/calendar/auth/google:
    get:
      tags: [Calendar]
      summary: Get Google OAuth authorization URL, or report already-connected
      description: "userId may come from x-user-id header OR a userId query param (the only endpoint in this route file that accepts either)."
      operationId: getGoogleAuthUrl
      security: [{ userIdHeader: [] }]
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "Alternative to the x-user-id header."
      responses:
        '200':
          description: Connection status / auth URL.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          connected: { type: boolean }
                          email:
                            type: [string, 'null']
                            format: email
                            description: "The connected Google account's primary-calendar address (FR-124); null when not connected or unreadable."
                          authUrl: { type: [string, 'null'] }
        '401':
          description: Missing user ID.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/auth/google/callback:
    get:
      tags: [Calendar]
      summary: Google OAuth callback (redirect, not JSON)
      description: |
        On success or failure, this always issues a 302 redirect back to
        `${FRONTEND_URL}/dashboard` with a `googleAuth=success` or
        `googleAuth=error&message=...` query param — it never returns a JSON
        body. Also reachable via the legacy alias `GET /auth/google/callback`
        (registered directly in `server.ts`), which itself just 302-redirects
        to this path with the query string preserved.
      operationId: googleOAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string, description: "The user ID, passed through as OAuth state." }
      responses:
        '302':
          description: Redirect to frontend dashboard with googleAuth=success|error.
          headers:
            Location:
              schema: { type: string }
        '400':
          description: Missing code or state (JSON, not a redirect, in this one case).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /auth/google/callback:
    get:
      tags: [Calendar]
      summary: Legacy OAuth callback alias (redirect shim only)
      description: "Registered directly in server.ts. Immediately 302-redirects to /api/calendar/auth/google/callback with the query string forwarded unchanged. Exists for backwards compatibility with a previously-registered Google OAuth redirect URI."
      operationId: legacyGoogleOAuthCallbackAlias
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to /api/calendar/auth/google/callback.
          headers:
            Location:
              schema: { type: string }

  /api/calendar/google/events:
    get:
      tags: [Calendar]
      summary: Fetch the user's Google Calendar events (across all their Google calendars)
      operationId: getGoogleCalendarEvents
      security: [{ userIdHeader: [] }]
      parameters:
        - name: timeMin
          in: query
          schema: { type: string, format: date-time, description: "Defaults to start of current week (Monday) if omitted." }
        - name: timeMax
          in: query
          schema: { type: string, format: date-time }
        - name: maxResults
          in: query
          schema: { type: integer, default: 250 }
      responses:
        '200':
          description: Events from Google Calendar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GoogleCalendarEvent' }
                  count: { type: integer }
                  source: { type: string, const: google_calendar }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id, or Google authorization expired/revoked with no refresh token (code TOKEN_REFRESH_FAILED or NO_REFRESH_TOKEN).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: error }
                  code: { type: string }
                  message: { type: string }
                  error: { type: string }
        '500':
          description: Unexpected failure (status code passed through from a thrown error's `status` field when present, defaulting to 500).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    post:
      tags: [Calendar]
      summary: Create an event on the caller's Google Calendar (B-lite, parents only)
      description: >
        Writes the event to the caller's Google Calendar (`primary` for now) via
        `events.insert`, then mirrors it into `calendar_events` tagged with its
        `google_event_id` so family members who aren't attendees still see it.
        Google is the source of truth — the mirror row is never edited by hand.
        The mirror write is best-effort: a failure leaves `mirrorId` null but the
        request still succeeds because the event exists in Google. Restricted to
        family members with role `parent` or `admin`.
      operationId: createGoogleCalendarEvent
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleCalendarEventInput' }
      responses:
        '201':
          description: Created in Google (and, best-effort, mirrored locally).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/GoogleCalendarEvent'
                      - type: object
                        properties:
                          google_event_id: { type: string }
                          google_calendar_id: { type: string }
                          mirrorId: { type: [string, 'null'], description: "calendar_events row id, or null if the mirror write failed." }
                  timestamp: { type: string, format: date-time }
        '400':
          description: Invalid body (missing summary, bad date/time format, invalid attendee email, etc.).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id, or Google isn't connected / authorization expired (code NO_TOKEN, TOKEN_REFRESH_FAILED, NO_REFRESH_TOKEN).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin in their family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: Caller has no family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure (upstream Google status passed through when present).
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/google/disconnect:
    post:
      tags: [Calendar]
      summary: Disconnect Google Calendar
      description: "Best-effort token revoke with Google (failure is logged but does not block); always marks the local integration inactive."
      operationId: disconnectGoogleCalendar
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: Disconnected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Google Calendar disconnected successfully" }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/dismissed:
    get:
      tags: [Calendar]
      summary: List event IDs the user has dismissed from view
      operationId: listDismissedEvents
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: Dismissed events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id: { type: string, description: "An occurrence id, or (when scope=series) Google's recurringEventId." }
                        calendar_id: { type: [string, 'null'] }
                        dismissed_at: { type: string, format: date-time }
                        scope: { type: string, enum: [occurrence, series], description: "series → every occurrence of this recurring event is hidden (FR-126)." }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/dismissed/{eventId}:
    delete:
      tags: [Calendar]
      summary: Restore a dismissed event (undo a hide; re-accepts in Google when applicable)
      description: >
        Removes the local hide. When `source=google` and the user had declined
        the invite, best-effort flips their Google RSVP back to `accepted`
        (FR-127) — skipped for `scope=series` (nothing was declined).
        `calendarId` / `source` / `scope` may be given as query params or in the
        request body. For a series, `eventId` is Google's recurringEventId.
      operationId: restoreDismissedEvent
      security: [{ userIdHeader: [] }]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
        - name: calendarId
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string, enum: [google, local] }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [occurrence, series] }
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    type: object
                    properties:
                      local: { type: boolean }
                      synced: { type: boolean }
                      action: { type: string, enum: [accepted] }
                      reason: { type: string }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/events/{id}/dismiss:
    post:
      tags: [Calendar]
      summary: Dismiss an event from the calendar view (local hide + Google decline when invited)
      description: >
        Always records a local hide so the event stays out of this user's Family
        Hub calendar. When `source` is `google`, `scope` is `occurrence`, and the
        connected user is an attendee of the event, also sets their RSVP to
        `declined` in Google Calendar (requires the `calendar.events` OAuth scope
        — a token predating it yields `reason: reconnect_required`). A
        `scope: series` dismiss (FR-126) hides every occurrence of the recurring
        event and is a local hide only — no Google call.
      operationId: dismissCalendarEvent
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: "Local event UUID or Google event ID (an occurrence id for a recurring event)." }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                calendarId: { type: string, description: "Google calendar ID, when dismissing a Google event." }
                source:
                  type: string
                  enum: [google, local]
                  description: "Origin of the event. `google` enables the two-way decline; anything else is a local hide only."
                scope:
                  type: string
                  enum: [occurrence, series]
                  default: occurrence
                  description: "`series` (FR-126) hides every occurrence of the recurring event; requires `recurringEventId`. Local hide only."
                recurringEventId:
                  type: string
                  description: "Google's series-master id. Required when `scope` is `series`; the dismissed_events row is keyed by it."
      responses:
        '200':
          description: Dismissed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Event dismissed successfully" }
                  data:
                    type: object
                    properties:
                      local: { type: boolean, const: true }
                      scope: { type: string, enum: [occurrence, series] }
                      synced: { type: boolean, description: "True only when the invite was declined in Google." }
                      action: { type: string, enum: [declined] }
                      reason:
                        type: string
                        enum: [no_token, not_an_attendee, reconnect_required, google_error]
                        description: "Why the Google decline didn't happen (absent on success)."
                  timestamp: { type: string, format: date-time }
        '400':
          description: Missing event ID.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/people:
    get:
      tags: [Calendar]
      summary: List every per-event person tag for the caller's family (FR-153)
      description: >
        One row per (event, family member) assignment. The client maps them by
        `event_id` and renders the coloured Going/Maybe dots after each event
        title. `event_id` is the Google event id, or a local `calendar_events`
        UUID as text.
      operationId: listEventPeople
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: All person tags for the family.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventPerson' }
                  count: { type: integer }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: Caller has no family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/events/{eventId}/people:
    put:
      tags: [Calendar]
      summary: Replace the person tags for one event (FR-153, parents/admins only)
      description: >
        Sends the full desired set of assignments for the event; the server
        diffs it (delete-all then insert). An empty `people` array clears the
        event. Rejects a `familyMemberId` that isn't a member of the caller's
        family.
      operationId: setEventPeople
      security: [{ userIdHeader: [] }]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, description: "Google event ID, or local event UUID." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPeopleInput' }
      responses:
        '200':
          description: The new set of person tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventPerson' }
                  count: { type: integer }
                  timestamp: { type: string, format: date-time }
        '400':
          description: Body isn't an array, an unknown familyMemberId, or a bad role.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: Caller has no family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/calendar/google/events/{id}:
    patch:
      tags: [Calendar]
      summary: Update a feature-created Google event (creator only)
      description: >
        Patches the Google event and refreshes its `calendar_events` mirror row.
        Only events that were created through this feature (i.e. have a mirror row
        carrying the `google_event_id`) can be edited, and only by the user who
        created them. If Google reports the event gone, the stale mirror row is
        dropped and a 404 is returned.
      operationId: updateGoogleCalendarEvent
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: "The Google event id." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleCalendarEventInput' }
      responses:
        '200':
          description: Updated in Google and in the local mirror.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/GoogleCalendarEvent'
                      - type: object
                        properties:
                          google_event_id: { type: string }
                          google_calendar_id: { type: string }
                          mirrorId: { type: [string, 'null'] }
                  timestamp: { type: string, format: date-time }
        '400':
          description: Invalid body.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '401':
          description: Missing x-user-id, or Google authorization expired.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin, or not the event's creator.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No feature-created event with that id, the caller has no family, or Google reports the event no longer exists.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    delete:
      tags: [Calendar]
      summary: Delete a feature-created Google event (creator only)
      description: >
        Deletes the Google event and drops its `calendar_events` mirror row. Only
        the creating user can delete. A Google 404/410 (already gone upstream) is
        treated as success — `data.alreadyGone` reports which happened.
      operationId: deleteGoogleCalendarEvent
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: "The Google event id." }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sendInvites: { type: boolean, default: true, description: "false → sendUpdates: none (no cancellation emails to attendees)." }
      responses:
        '200':
          description: Deleted (or already gone upstream).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      alreadyGone: { type: boolean, description: "True when Google reported the event already deleted." }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id, or Google authorization expired.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '403':
          description: Caller is not a parent/admin, or not the event's creator.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No feature-created event with that id, or the caller has no family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

