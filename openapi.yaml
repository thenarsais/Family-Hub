          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/habits/mood/today:
    get:
      tags: [Habits]
      summary: The caller's mood entry for the family-local today
      operationId: getTodayMood
      security: [{ userIdHeader: [] }]
      responses:
        '200':
          description: Today's mood, or null if not yet logged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  mood:
                    oneOf:
                      - { $ref: '#/components/schemas/MoodEntry' }
                      - { type: 'null' }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/habits/mood:
    post:
      tags: [Habits]
      summary: Record (or replace) the caller's mood for today
      description: >-
        One row per member per family-local day; posting again before midnight
        overwrites it.
      operationId: setMood
      security: [{ userIdHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
