openapi: 3.1.0
info:
  title: Family Hub API
  version: "1.0.0"
  description: |
    Family Hub backend API (Express + TypeScript + Supabase/Postgres).

    This spec documents the API **as it actually behaves today**, including
    two genuinely different response-envelope conventions and three
    different auth conventions, depending on which route file an endpoint
    lives in. See `docs/API.md` for a human-oriented companion/index to this
    spec, including narrative explanation of the quirks below.

    ## Response envelopes (two incompatible conventions)

    - **Newer routes** (`chores`, `learning`, `announcements`, `reminders`,
      `energy`, `calendar`, `family`, `activity-log`, `smartthings`) return
      an object with a top-level `status: 'success' | 'error'` field and a
      `timestamp` ISO string on every response. On error, the shape is
      `{ status: 'error', message: string, error?: string }`
      (see `EnvelopeError`). On success, most — but **not all** — of these
      routes nest the payload under a `data` key alongside `count?`
      (see `EnvelopeSuccess`). Several endpoints in this same "newer" group
      (`chores`, `smartthings`, `learning`, `performance`-adjacent routes)
      instead use an endpoint-specific top-level key (e.g. `chores`,
      `devices`, `stats`, `progress`, `activity`, `history`) instead of
      `data`. Each such endpoint documents its literal response shape
      below rather than being forced into `EnvelopeSuccess` — do not assume
      every 2xx response in this group has a `data` key; check the specific
      path.
    - **Older routes** (`auth`, `users`, `badges`, `points`,
      `external-apis`) return ad hoc, endpoint-specific objects with no
      consistent wrapper at all (no `status`/`success` field, no
      `timestamp`). Each such endpoint's schema is documented individually.
    - `middleware/response-formatter.ts` installs a *third* envelope
      (`res.success()` -> `{ success, data, message?, timestamp, meta? }`)
      as global Express middleware, but **no route handler in this codebase
      actually calls `res.success()`/`res.created()`/`res.paginated()`** —
      it is registered, unused, dead infrastructure. It is intentionally
      *not* documented as the contract for any endpoint below.

    ## Auth conventions (three, genuinely different)

    - `auth`, `users`, `badges`, `points`, `external-apis`: require an
      `Authorization: Bearer <token>` header to be *present* on every
      route except `POST /auth/signup` and `POST /auth/login`. The server
      only checks that the header exists and is prefixed `Bearer `; for
      most routes in this group it does not cryptographically verify the
      token server-side (the one exception is `GET /auth/me`, which calls
      `supabase.auth.getUser(token)`). Modeled as `bearerAuth`.
    - `chores`, `learning`, `announcements`, `reminders`, `energy`,
      `calendar`, `family`, `activity-log`: require a custom `x-user-id`
      header identifying the caller. There is no cryptographic
      verification of this header at all — any value is trusted as-is.
      Modeled as `userIdHeader`.
    - `smartthings`, `performance`, `deployment`, `health`: no auth of any
      kind.

    ## Known quirks worth knowing about before you rely on this spec

    - **`GET /health` is shadowed.** There are two implementations: a
      legacy one registered directly in `server.ts` (`{status, timestamp,
      environment}`) and a richer one in `routes/deployment.ts`
      (`{status, timestamp, environment, uptime, version}`). Because
      Express matches routes in registration order and the legacy handler
      is registered first, **the legacy handler always wins** — the
      deployment.ts version is effectively dead code at this path. This
      spec documents the deployment.ts richer shape as canonical (it's the
      one that *should* be reachable), with a note on the path itself.
    - **`chores`, `learning`, and `smartthings` do not use the Supabase
      schema in `types/database.ts` for their primary entities.** They
      read/write different, hand-rolled tables (`chores`,
      `chore_completions`, `learning_progress`, `learning_quiz_answers`,
      `smartthings_devices`) via a raw `pg` connection pool, with field
      names that do not match the generated Supabase types of the
      similarly-named tables (`chores`, `learning_progress`,
      `smart_devices`) in `types/database.ts`. The schemas below for
      `Chore`, `ChoreCompletion`, `LearningProgressEntry`, and
      `SmartDevice` are modeled from the actual service-layer TypeScript
      interfaces, not from `types/database.ts`, because for these three
      feature areas the generated Supabase types describe a schema the
      running code does not use.
    - **`GET /api/smartthings/devices/:deviceId/history` queries a
      `point_transactions` table** that does not appear anywhere in
      `types/database.ts` either. Documented as best-effort/loosely-typed.
    - **`users.birth_year` and `users.is_under_13`** are read and written
      by real code (`UserRepository`, `POST /api/family/children`) but are
      absent from the generated `types/database.ts` `users` table — the
      generated types are stale relative to the live schema. They are
      included in the `User` schema below.
  contact:
    name: Family Hub Engineering

tags:
  - name: Health
    description: Liveness/health endpoints (note the /health shadowing quirk documented on that path).
  - name: Deployment
    description: Readiness/startup probes, Prometheus metrics, app info/config (root-mounted, no auth).
  - name: Auth
    description: Signup, login, logout, current-user (legacy ad hoc response shapes, Bearer auth).
  - name: Users
    description: User profile CRUD and parent/child lookups (Bearer auth).
  - name: Badges
    description: Badge catalog and per-user badge awarding (Bearer auth).
  - name: Points
    description: Points ledger, breakdowns, leaderboard (Bearer auth).
  - name: SmartThings
    description: Smart-home device listing/control (no auth; uses a hand-rolled device table, not Supabase smart_devices).
  - name: Chores
    description: Chore creation/completion/progress (x-user-id auth; uses a hand-rolled chores schema, not Supabase chores).
  - name: Habits
    description: Habit tracking (weekly target + streak) and the daily mood check-in (x-user-id auth; hand-rolled schema, migration 013).
  - name: Kids
    description: T-12 — a parent acting for a young child (routine checklists + mood tap, no scoring; x-user-id is the parent; migration 015).
  - name: Kiosk
    description: T-14 — shared wall-display enrolment, profile bootstrap, and the numeric family PIN (migration 016). Enrol/list/PIN routes use x-user-id (parent); POST /session uses x-kiosk-token and no user login.
  - name: Learning
    description: Lesson completion, quizzes, learning stats (x-user-id auth; hand-rolled schema, not Supabase learning_progress).
  - name: Trivia
    description: T-09 — one shared daily question + a per-user participation streak (x-user-id auth; migration 018). No games, leaderboard, or badges.
  - name: Homework
    description: T-20 — dated one-shot homework items with a per-item points value, board section + parent panel (x-user-id auth; migration 019). No recurrence, no streak.
  - name: Reading
    description: T-21 — a daily reading-minutes log against parent-set daily/weekly goals, flat points on the daily goal, a goal-met streak (x-user-id auth; migration 020).
  - name: KungFu
    description: T-22 — a free-form class/practice training log (multiple entries per day allowed) plus a parent-set belt profile (x-user-id auth; migration 021). No fixed schedule, no auto belt progression.
  - name: Quests
    description: T-23 — 3 random daily quests drawn from the other 8 sections, each auto-detected against that section's own table (no separate completion path), a flat +50 bonus when all 3 are done (x-user-id auth; migration 022). Read-only — a single GET.
  - name: Rewards
    description: T-24 — a family-editable reward library plus two milestones (a per-kid weekly points goal, and the existing monthly bronze/silver/gold tiers) that create a pending reward a parent later fulfills (x-user-id auth; migration 023). Fulfilling never touches the points ledger.
  - name: Announcements
    description: Family announcements/messaging (x-user-id auth).
  - name: Reminders
    description: Scheduled reminders and dismissal (x-user-id auth).
  - name: Shopping
    description: The shared family shopping list (x-user-id auth; family-scoped).
  - name: Meals
    description: The family meal planner (x-user-id auth; family-scoped; one row per date + slot).
  - name: Energy
    description: Energy usage tracking and goals (x-user-id auth for goal endpoints; usage/summary endpoints are unauthenticated).
  - name: Water
    description: FR-139 — City of Thornton water usage via the WaterSmart portal (no official API; scraped login + a JSON usage endpoint). Unauthenticated, family-wide, same as Energy. Credentials are env vars (WATERSMART_HOSTNAME/EMAIL/PASSWORD), not a per-user store — a background poll every 4h keeps water_usage current; POST /sync triggers one on demand (rate-limited to once per 2 minutes).
  - name: Maintenance
    description: T-15 (FR-078 + FR-080-core + FR-081) — a family-wide, user-definable list of recurring home-maintenance items (x-user-id auth). "Next due" is always computed (last_done_at + interval_days), never stored; marking done just resets last_done_at to today. No role gate, no points — any signed-in member can manage it, same as the shopping list.
  - name: Calendar
    description: Family calendar events plus Google Calendar OAuth/sync (x-user-id auth; OAuth callback is unauthenticated by nature).
  - name: Family
    description: Family creation, membership, invitations, settings (x-user-id auth).
  - name: ActivityLog
    description: Dashboard activity feed and stats (x-user-id auth; POST /log has no auth check).
  - name: ExternalAPIs
    description: Dictionary (Merriam-Webster), weather (OpenWeather), and email (SendGrid) passthroughs (Bearer auth).
  - name: Performance
    description: Query/request/compression diagnostics (no auth).

servers:
  - url: /
    description: Relative to wherever the Express app is hosted (no fixed base path).

security: []

paths:
  # ================================================================
  # HEALTH
  # ================================================================
  /health:
    get:
      tags: [Health]
      summary: Liveness probe (SHADOWED — see description)
      description: |
        **Important:** two handlers are registered for this exact path.
        `server.ts` registers a legacy inline handler *before*
        `routes/deployment.ts` mounts its own `GET /health`. Express
        dispatches to the first matching route, so the legacy handler in
        `server.ts` always wins in practice, and the richer handler
        documented here (from `deployment.ts`) is currently unreachable
        dead code. The response below is what `deployment.ts` *would*
        return if it were reachable; the actual live response today is the
        legacy shape: `{ status: 'ok', timestamp: string, environment: string }`
        (no `uptime` or `version` fields).
      operationId: getHealthCanonical
      responses:
        '200':
          description: Process is alive (legacy handler shape actually served today).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentHealth'
        '503':
          description: Process is not alive (only reachable if the legacy handler is ever removed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: unavailable }
                  message: { type: string }

  /api:
    get:
      tags: [Health]
      summary: Comprehensive health check (mounted at /api via routes/health.ts's root handler)
      operationId: getApiHealth
      responses:
        '200':
          description: Health status with uptime and a hardcoded db flag.
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, uptime, database]
                properties:
                  status: { type: string, const: healthy }
                  timestamp: { type: string, format: date-time }
                  uptime: { type: number, description: process.uptime() in seconds }
                  database: { type: string, const: connected, description: "Hardcoded; not an actual live DB check (see code comment 'Phase 1: add actual DB health check')." }
    head:
      tags: [Health]
      summary: HEAD health check
      operationId: headApiHealth
      responses:
        '200':
          description: Empty body, 200 status only.

  # ================================================================
  # DEPLOYMENT (root-mounted, no prefix)
  # ================================================================
  /ready:
    get:
      tags: [Deployment]
      summary: Readiness probe
      operationId: getReady
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
        '503':
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
        '500':
          description: Readiness check itself threw.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: error }
                  message: { type: string }
                  timestamp: { type: string, format: date-time }

  /startup:
    get:
      tags: [Deployment]
      summary: Startup probe (started once uptime > 5s and no unhealthy readiness checks)
      operationId: getStartup
      responses:
        '200':
          description: Application has finished starting up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: started }
                  uptime: { type: number }
                  timestamp: { type: string, format: date-time }
        '503':
          description: Still starting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: starting }
                  uptime: { type: number }
                  checks: { type: array, items: { type: object } }
                  summary: { type: object }

  /metrics:
    get:
      tags: [Deployment]
      summary: Prometheus-style text metrics
      operationId: getMetrics
      responses:
        '200':
          description: Plain-text Prometheus exposition format (process uptime, heap usage, node version).
          content:
            text/plain:
              schema:
                type: string

  /info:
    get:
      tags: [Deployment]
      summary: Application info
      operationId: getInfo
      responses:
        '200':
          description: Static-ish application metadata. Note the `endpoints` counts are hardcoded in source and not derived from the live route table (do not treat them as authoritative).
          content:
            application/json:
              schema:
                type: object
                properties:
                  application: { type: string }
                  version: { type: string }
                  environment: { type: string }
                  node: { type: string }
                  uptime: { type: number }
                  timestamp: { type: string, format: date-time }
                  endpoints: { type: object, additionalProperties: { type: integer } }
                  features: { type: array, items: { type: string } }

  /config:
    get:
      tags: [Deployment]
      summary: Current configuration (redacted; blocked outside dev)
      operationId: getConfig
      responses:
        '200':
          description: Redacted configuration snapshot (values replaced with "[configured]"/"[not set]").
          content:
            application/json:
              schema:
                type: object
                properties:
                  environment: { type: string }
                  port: { type: string }
                  database: { type: object, properties: { url: { type: string }, poolSize: { type: string } } }
                  redis: { type: object, properties: { url: { type: string } } }
                  supabase: { type: object, properties: { url: { type: string }, key: { type: string } } }
                  cors: { type: object, properties: { origins: { type: string } } }
        '403':
          description: Not available when ENVIRONMENT=production.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: "Configuration not available in production" }

  # ================================================================
  # AUTH
  # ================================================================
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Register a new parent/admin user
      description: |
        Only `role: 'parent'` may self-register (COPPA compliance,
        FRAMEWORK.md Decision #29). `role: 'child'` is explicitly rejected
        with 400 — child accounts can only be created by an existing parent
        via `POST /api/family/children`. A family is auto-created for new
        parent/admin users on success (best-effort; failure does not fail
        the signup).
      operationId: authSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, role]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                name: { type: string }
                role: { type: string, enum: [parent], description: "'child' is rejected with 400; any value other than 'parent' is rejected with 400." }
                account_type: { type: string, default: primary }
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, const: "User created successfully" }
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string }
                      name: { type: string }
                      role: { type: string }
        '400':
          description: Missing fields, child self-registration attempt, invalid role, or Supabase signup failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
                  required: { type: array, items: { type: string } }
        '500':
          description: Unexpected failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyErrorBody'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and return a Supabase session
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, const: "Login successful" }
                  session:
                    type: object
                    properties:
                      access_token: { type: [string, 'null'] }
                      refresh_token: { type: [string, 'null'] }
                      expires_in: { type: [integer, 'null'] }
                  user:
                    type: object
                    properties:
                      id: { type: [string, 'null'] }
                      email: { type: [string, 'null'] }
                      name: { type: [string, 'null'] }
                      role: { type: [string, 'null'] }
        '400':
          description: Missing email or password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyErrorBody' }
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyErrorBody' }
        '500':
          description: Unexpected failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyErrorBody' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out the current Supabase session
      description: Signs out the server's Supabase client session (not scoped to the caller's specific token) and returns success regardless of Supabase-side warnings.
      operationId: authLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token: { type: string, description: "Required by the handler's validation, but not actually used to scope the Supabase signOut() call." }
      responses:
        '200':
          description: Logout successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, const: "Logout successful" }
        '400':
          description: Missing access_token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyErrorBody' }
        '500':
          description: Unexpected failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyErrorBody' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user (real token verification)
      description: The one endpoint in `auth.ts`/`users.ts`/`badges.ts`/`points.ts` that actually cryptographically verifies the bearer token via `supabase.auth.getUser(token)`, rather than just checking header presence.
      operationId: authMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: [string, 'null'] }
                      email: { type: [string, 'null'] }
                      name: { type: [string, 'null'] }
                      role: { type: [string, 'null'] }
                      created_at: { type: [string, 'null'], format: date-time }
        '401':
          description: Missing/invalid authorization header, or invalid/expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyErrorBody' }
        '500':
          description: Unexpected failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyErrorBody' }

  # ================================================================
  # USERS
  # ================================================================
  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user's profile by explicit userId query param
      description: "Despite the name, this does NOT derive the user from the bearer token — it requires a `userId` query parameter (the code comment admits: 'In a real app, extract user ID from token')."
      operationId: usersMe
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserProfileFull' }
        '400':
          description: Missing userId.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '404':
          description: User not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '401':
          description: Missing authorization header.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUserById
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserProfileBasic' }
        '401':
          description: Missing authorization header.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '404':
          description: User not found.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
    put:
      tags: [Users]
      summary: Update user profile (name and/or email only)
      operationId: updateUser
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, const: "User updated successfully" }
                  user: { $ref: '#/components/schemas/UserProfileBasic' }
        '400':
          description: No fields to update.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '401':
          description: Missing authorization header.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
    delete:
      tags: [Users]
      summary: Soft-delete a user (sets is_active = false)
      operationId: deleteUser
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, const: "User deleted successfully" }
        '401':
          description: Missing authorization header.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }

  /api/users/{parentId}/children:
    get:
      tags: [Users]
      summary: List a parent's children (via linked_accounts join)
      operationId: getParentChildren
      security: [{ bearerAuth: [] }]
      parameters:
        - name: parentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Children list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  parent_id: { type: string }
                  children:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        email: { type: string }
                        role: { type: string }
                        created_at: { type: string, format: date-time }
        '401':
          description: Missing authorization header.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyErrorBody' } } }

  /api/users/role/parents:
    get:
      tags: [Users]
      summary: List all parent users
      operationId: getAllParents
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Parents list.
          content:
