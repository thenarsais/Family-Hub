  /api/reminders/{id}:
    patch:
      tags: [Reminders]
      summary: Update a reminder
      description: "Family-scoped. Body is passed through with only a column-name whitelist (no other validation)."
      operationId: updateReminder
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                reminder_type: { type: string }
                related_item_id: { type: string }
                related_item_type: { type: string }
                scheduled_time: { type: string, format: date-time }
                remind_before_minutes: { type: integer }
                recurrence: { type: string }
                recurrence_end_date: { type: string, format: date }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Reminder' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No such reminder in the caller's family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
    delete:
      tags: [Reminders]
      summary: Delete a reminder
      description: Permanent, family-scoped.
      operationId: deleteReminder
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, const: "Reminder deleted" }
                  timestamp: { type: string, format: date-time }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No such reminder in the caller's family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/reminders/{id}/dismiss:
    post:
      tags: [Reminders]
      summary: Dismiss a reminder
      description: >-
        A one-off reminder is hidden (`is_dismissed = true`). A recurring reminder
        is treated as "done this time" and rolls forward to its next occurrence
        instead — unless it is past its `recurrence_end_date`, in which case it is
        hidden. Returns the resulting row.
      operationId: dismissReminder
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The reminder after dismissal / roll-forward.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Reminder' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No such reminder in the caller's family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

  /api/reminders/{id}/restore:
    post:
      tags: [Reminders]
      summary: Un-dismiss a reminder
      operationId: restoreReminder
      security: [{ userIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The restored reminder.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Reminder' }
        '401':
          description: Missing x-user-id.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '404':
          description: No such reminder in the caller's family.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }
        '500':
          description: Unexpected failure.
          content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } }

