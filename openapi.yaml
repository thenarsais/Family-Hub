  # ================================================================
  # PERFORMANCE (no auth)
  # ================================================================
  /performance/health:
    get:
      tags: [Performance]
      summary: Overall system health (query/request/compression stats)
      operationId: getPerformanceHealth
      responses:
        '200':
          description: Health snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: healthy }
                  timestamp: { type: string, format: date-time }
                  database: { type: object }
                  requests: { type: object }
                  compression: { type: object }

  /performance/queries:
    get:
      tags: [Performance]
      summary: Query performance statistics, slow queries, and recommendations
      operationId: getQueryPerformance
      responses:
        '200':
          description: Query stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statistics: { type: [object, 'null'] }
                  slowQueries: { type: array, items: { type: object } }
                  recommendations: { type: array, items: {} }

  /performance/queries/slow:
    get:
      tags: [Performance]
      summary: Get slow queries
      operationId: getSlowQueries
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Slow queries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  queries: { type: array, items: { type: object } }

  /performance/queries/n-plus-one:
    get:
      tags: [Performance]
      summary: Detect N+1 query patterns
      operationId: getNPlusOnePatterns
      responses:
        '200':
          description: Patterns (or an explicit "none detected" message).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, description: "Only present when no patterns were detected." }
                  patternsDetected: { type: integer, description: "Only present when patterns were detected." }
                  patterns:
                    type: array
                    items:
                      type: object
                      properties:
                        pattern: { type: string }
                        occurrences: { type: integer }

  /performance/requests:
    get:
      tags: [Performance]
      summary: Request performance statistics, recent requests, recent errors
      operationId: getRequestPerformance
      responses:
        '200':
          description: Stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statistics: { type: [object, 'null'] }
                  recentRequests: { type: array, items: { type: object } }
                  recentErrors: { type: array, items: { type: object } }

  /performance/compression:
    get:
      tags: [Performance]
      summary: Response compression statistics
      operationId: getCompressionStats
      responses:
        '200':
          description: Stats (or an explicit "no data yet" message).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, description: "Only present when no compression data is available yet." }
                  compressionRatio: { type: number }
                  totalBytesSaved: { type: integer }

  /performance/indexes:
    get:
      tags: [Performance]
      summary: Database index monitoring queries (informational SQL, not executed)
      operationId: getIndexMonitoringQueries
      responses:
        '200':
          description: SQL snippets to run manually.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  queries: { type: object }

  /performance/summary:
    get:
      tags: [Performance]
      summary: Complete performance summary (query + request + compression + overall health rollup)
      operationId: getPerformanceSummary
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp: { type: string, format: date-time }
                  database:
                    type: object
                    properties:
                      queries: { type: [object, 'null'] }
                      recommendations: { type: array, items: {} }
                      nPlusOnePatterns: { type: integer }
                  requests: { type: [object, 'null'] }
                  compression: { type: [object, 'null'] }
                  overallHealth:
                    type: object
                    properties:
                      databaseHealth: { type: string, enum: [good, "needs attention", "no data"] }
                      requestHealth: { type: string, enum: [good, "needs attention", "no data"] }

  /performance/index-sql:
    post:
      tags: [Performance]
      summary: Generate recommended CREATE INDEX SQL for a table
      operationId: getIndexSql
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                table: { type: string }
      responses:
        '200':
          description: Generated SQL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sql: { type: string }
                  message: { type: string }
        '500':
          description: Failed to generate SQL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>` must be present. Used by `auth`,
        `users`, `badges`, `points`, `external-apis`. For most routes in
        this group the server only checks the header is present and
        prefixed `Bearer ` — it does not cryptographically verify the
        token (the one exception is `GET /auth/me`, which does call
        `supabase.auth.getUser(token)`).
    userIdHeader:
      type: apiKey
      in: header
      name: x-user-id
      description: |
        Custom header identifying the caller by user ID. Used by `chores`,
        `learning`, `announcements`, `reminders`, `energy`, `calendar`,
        `family`, `activity-log`. There is no cryptographic verification —
        any UUID-shaped (or even arbitrary) value is trusted as-is. A few
        endpoints within these route files (e.g. `GET /api/energy/usage`,
        `POST /api/activity/log`, several PATCH/DELETE-by-id endpoints in
        `announcements`/`reminders`/`calendar`) do not actually check this
        header despite living in the same route file — see the per-endpoint
        `security` field and description for exceptions.

  parameters:
    UserIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPathBadges:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      schema: { type: string }

  schemas:
    # ---------------- Generic envelopes ----------------
    EnvelopeSuccess:
      type: object
      description: |
        The success shape used by MOST (not all) "newer" routes. `count`
        is present on list endpoints, absent on single-resource endpoints.
        `data`'s actual type varies per endpoint — see the `allOf` override
        on each path.
      required: [status, timestamp]
      properties:
        status: { type: string, const: success }
        data: {}
        count: { type: integer }
        timestamp: { type: string, format: date-time }

    EnvelopeError:
      type: object
      description: The error shape used consistently by all "newer" routes (chores, learning, announcements, reminders, energy, calendar, family, activity-log, smartthings).
      required: [status, message]
      properties:
        status: { type: string, const: error }
        message: { type: string }
        error: { type: string, description: "Present on most (not all) error responses; usually a raw error message string." }

    LegacyErrorBody:
      type: object
      description: The ad hoc error shape used by "older" routes (auth, users, badges, points, external-apis). No `status`/`timestamp` field; shape varies slightly per endpoint but always includes `error`.
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        required: { type: array, items: { type: string }, description: "Present only on some 'missing required fields' 400s." }

    ReadinessResult:
      type: object
      properties:
        status: { type: string, enum: [ready, not_ready] }
        timestamp: { type: string, format: date-time }
        checks: { type: array, items: { type: object } }
        summary: { type: object }

    DeploymentHealth:
      type: object
      required: [status, timestamp, environment, uptime, version]
      properties:
        status: { type: string, const: ok }
        timestamp: { type: string, format: date-time }
        environment: { type: string }
        uptime: { type: number, description: process.uptime() in seconds }
        version: { type: string }

    EmailSentResponse:
      type: object
      properties:
        message: { type: string }
        messageId: { type: string, description: "'demo-<timestamp>' when SENDGRID_API_KEY is unset (demo mode), otherwise SendGrid's x-message-id response header, or 'unknown'." }

    # ---------------- Users / Auth ----------------
    User:
      type: object
      description: |
        Raw `users` table row, from `UserRepository`. NOTE: `birth_year`
        and `is_under_13` are read/written by real code (see
        `POST /api/family/children`) but are absent from the generated
        `types/database.ts` — the generated types are stale relative to
        the live schema; they are included here because they are real.
      required: [id, email, name, role, account_type, is_active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [parent, child] }
        account_type: { type: string, enum: [primary, coparent, guardian, child] }
        password_hash: { type: string, description: "Internally, this column stores the Supabase Auth user ID as a reference, not an actual password hash." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login: { type: [string, 'null'], format: date-time }
        is_active: { type: boolean }
        birth_year: { type: [integer, 'null'] }
        is_under_13: { type: [boolean, 'null'] }

    UserProfileFull:
      type: object
      description: Subset returned by GET /users/me.
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        account_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserProfileBasic:
      type: object
      description: Subset returned by GET/PUT /users/{id}.
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        created_at: { type: string, format: date-time }

    # ---------------- Badges / Points ----------------
    Badge:
      type: object
      description: Raw `badges` table row.
      required: [id, title, category, tier]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        icon_emoji: { type: [string, 'null'] }
        category: { type: string }
        tier: { type: string, enum: [bronze, silver, gold, platinum] }
        points_required: { type: [integer, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    ActivityPointsEntry:
      type: object
      description: Raw `activity_points` table row (the one real points ledger; used by PointsRepository and by chores/learning point awards).
      required: [id, user_id, activity_type, points, reason]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        activity_type: { type: string }
        points: { type: number }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    # ---------------- SmartThings ----------------
    SmartDevice:
      type: object
      description: |
        Hand-rolled device shape from `smartthings_devices` table (via
        `SmartThingsService`), NOT the Supabase `smart_devices` table in
        `types/database.ts` (different table, different columns entirely).
      required: [deviceId, name, type, status]
      properties:
        deviceId: { type: string }
        name: { type: string }
        type: { type: string, enum: [light, switch, lock, climate, sensor, other] }
        room: { type: string }
        status: { type: object, additionalProperties: true, description: "Free-form capability/state map, e.g. {switch:'on', level:100} or {temperature:72, mode:'heat'}." }

    # ---------------- Chores (hand-rolled schema) ----------------
    Chore:
      type: object
      description: |
        From `ChoreService`'s raw-Postgres `chores` table — NOT the
        Supabase `chores` table in `types/database.ts` (which has entirely
        different columns: child_id/priority/status/due_date). This
        feature area's real schema is user_id/name/time_slot/points_value/enabled.
      required: [id, userId, name, timeSlot, pointsValue, enabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        timeSlot: { type: string, enum: [morning, afternoon, evening] }
        pointsValue: { type: number }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ChoreCompletion:
      type: object
      required: [id, choreId, userId, completedAt, pointsEarned]
      properties:
        id: { type: string, format: uuid }
        choreId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        pointsEarned: { type: number }

    ChoreProgress:
      type: object
      properties:
        totalCompleted: { type: integer }
        thisWeek: { type: integer }
        thisMonth: { type: integer }
        pointsEarned: { type: integer }

    ChorePointsSummary:
      type: object
      properties:
        totalPoints: { type: integer }
        dailyPoints: { type: integer }
        weeklyPoints: { type: integer }
        monthlyPoints: { type: integer }

    # ---------------- Learning (hand-rolled schema) ----------------
    LearningProgressEntry:
      type: object
      description: |
        From `LearningService`'s raw-Postgres `learning_progress` table —
        NOT the Supabase `learning_progress` table in `types/database.ts`
        (different columns: course_id/current_lesson_id/completion_percentage
        vs. this feature's lesson_id/category/phase/completed).
      required: [id, userId, lessonId, category, phase, completed, pointsEarned, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        lessonId: { type: string }
        category: { type: string, enum: [alphabet, numbers, vocabulary] }
        phase: { type: string }
        completed: { type: boolean }
        pointsEarned: { type: integer }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PhaseProgress:
      type: object
      properties:
        totalLessons: { type: integer }
        completedLessons: { type: integer }
        percentComplete: { type: integer, description: "0-100, rounded" }
        pointsEarned: { type: integer }

    LearningStats:
      type: object
      properties:
        totalLessonsCompleted: { type: integer }
        totalPointsEarned: { type: integer }
        alphabet: { type: object, properties: { completed: { type: integer }, total: { type: integer } } }
        numbers: { type: object, properties: { completed: { type: integer }, total: { type: integer } } }
        vocabulary: { type: object, properties: { completed: { type: integer }, total: { type: integer } } }

    # ---------------- Announcements ----------------
    Announcement:
      type: object
      description: Raw `announcements` table row (Tables<'announcements'>['Row']).
      required: [id, family_id, created_by_id, title, message]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: [string, 'null'], format: uuid }
        created_by_id: { type: string, format: uuid }
        title: { type: string }
        message: { type: string }
        announcement_type: { type: [string, 'null'] }
        priority: { type: [string, 'null'] }
        target_audience: { type: [string, 'null'] }
        target_user_ids: { type: [array, 'null'], items: { type: string } }
        is_pinned: { type: [boolean, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    AnnouncementWithReadStatus:
      allOf:
        - $ref: '#/components/schemas/Announcement'
        - type: object
          required: [is_read, reader_count]
          properties:
            is_read: { type: boolean }
            reader_count: { type: integer, description: "Currently always 0 — marked TODO in source, not yet implemented." }

    # ---------------- Reminders ----------------
    Reminder:
      type: object
      description: Raw `reminders` table row (Tables<'reminders'>['Row']).
      required: [id, user_id, title, reminder_type, scheduled_time]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        reminder_type: { type: string, enum: [chore, assignment, event, goal, custom] }
        related_item_id: { type: [string, 'null'] }
        related_item_type: { type: [string, 'null'] }
        scheduled_time: { type: string, format: date-time }
        remind_before_minutes: { type: [integer, 'null'] }
        recurrence: { type: [string, 'null'], enum: [once, daily, weekly, monthly, null] }
        recurrence_end_date: { type: [string, 'null'], format: date-time }
        is_dismissed: { type: [boolean, 'null'] }
        dismissed_at: { type: [string, 'null'], format: date-time }
        notification_sent: { type: [boolean, 'null'] }
        sent_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    # ---------------- Energy ----------------
    EnergyUsage:
      type: object
      description: Raw `energy_usage` table row (Tables<'energy_usage'>['Row']).
      required: [id, device_id, timestamp]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string }
        device_name: { type: [string, 'null'] }
        device_type: { type: [string, 'null'] }
        power_watts: { type: [number, 'null'] }
        energy_kwh: { type: [number, 'null'] }
        timestamp: { type: string, format: date-time }
        recorded_at: { type: [string, 'null'], format: date-time }

    EnergySummaryRow:
      type: object
      description: Raw `energy_summary` table row (Tables<'energy_summary'>['Row']).
      required: [id, period, period_start, period_end]
      properties:
        id: { type: string, format: uuid }
        period: { type: string, enum: [daily, weekly, monthly] }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        total_kwh: { type: [number, 'null'] }
        average_power_watts: { type: [number, 'null'] }
        peak_power_watts: { type: [number, 'null'] }
        peak_time: { type: [string, 'null'], format: date-time }
        device_count: { type: [integer, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    EnergyGoal:
      type: object
      description: Raw `energy_goals` table row (Tables<'energy_goals'>['Row']).
      required: [id, created_by_id, goal_type, start_date, end_date]
      properties:
        id: { type: string, format: uuid }
        created_by_id: { type: string, format: uuid }
        goal_type: { type: string, enum: [daily, weekly, monthly] }
        target_kwh: { type: [number, 'null'] }
        current_kwh: { type: [number, 'null'] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: [string, 'null'], description: "GET /api/energy/goals filters status = 'active'." }
        points_reward: { type: [integer, 'null'] }
        achieved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }

    # ---------------- Calendar ----------------
    CalendarEvent:
      type: object
      description: Raw `calendar_events` table row (Tables<'calendar_events'>['Row']).
      required: [id, family_id, created_by_id, event_title, event_date]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        created_by_id: { type: string, format: uuid }
        event_title: { type: string }
        event_description: { type: [string, 'null'] }
        event_type: { type: [string, 'null'] }
        event_date: { type: string, format: date }
        start_time: { type: [string, 'null'] }
        end_time: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    GoogleCalendarEvent:
      type: object
      description: Passthrough (lightly typed) of Google Calendar API event objects, plus calendar metadata attached by the service.
      properties:
        id: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        start:
          type: [object, 'null']
          properties:
            dateTime: { type: [string, 'null'] }
            date: { type: [string, 'null'] }
        end:
          type: [object, 'null']
          properties:
            dateTime: { type: [string, 'null'] }
            date: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        attendees:
          type: [array, 'null']
          items: { type: object, properties: { email: { type: string } } }
        calendarId: { type: string, description: "Attached by the service; identifies which of the user's Google calendars this event came from." }
        calendarName: { type: string }
        calendarColor: { type: string }

    GoogleCalendarEventInput:
      type: object
      description: >
        Body for creating/updating a Google Calendar event from the dashboard
        form. Wall-clock date/time parts are kept separate from the timezone,
        matching how Google's API wants a timed event ({ dateTime, timeZone }).
      required: [summary, startDate, timeZone]
      properties:
        summary: { type: string, description: "Event title. Required, non-empty." }
        description: { type: string }
        location: { type: string }
        allDay: { type: boolean, default: false }
        startDate: { type: string, format: date, description: "YYYY-MM-DD." }
        startTime: { type: string, pattern: '^\d{2}:\d{2}$', description: "HH:MM. Required when allDay is false." }
        endDate: { type: string, format: date, description: "YYYY-MM-DD. Defaults to startDate. For an all-day event this is the last day (the API's exclusive end is computed server-side)." }
        endTime: { type: string, pattern: '^\d{2}:\d{2}$', description: "HH:MM. Defaults to startTime + 1 hour." }
        timeZone: { type: string, description: "IANA timezone, e.g. America/New_York." }
        attendees:
          type: array
          items: { type: string, format: email }
          description: "Attendee email addresses. Each is validated for shape."
        sendInvites: { type: boolean, default: true, description: "false → sendUpdates: none (no invite/update/cancellation emails)." }
        calendarId: { type: string, default: primary, description: "Reserved for a future calendar picker; only 'primary' is used today." }

    # ---------------- Family ----------------
    Family:
      type: object
      description: Raw `families` table row (Tables<'families'>['Row']).
      required: [id, created_by_id, name]
      properties:
        id: { type: string, format: uuid }
        created_by_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        max_children: { type: [integer, 'null'] }
        max_parents: { type: [integer, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    FamilyMember:
      type: object
      description: >-
        A `family_members` table row, plus the member's `name` and `email` from
        the joined `users` row (both null for a member with no linked user).
      required: [id, family_id, user_id, role]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [admin, parent, child, guardian] }
        invited_by_id: { type: [string, 'null'], format: uuid }
        is_active: { type: [boolean, 'null'] }
        joined_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        color:
          type: [string, 'null']
          description: "Calendar colour key (migration 006); null until a parent assigns one."

    FamilyWithMembers:
      allOf:
        - $ref: '#/components/schemas/Family'
        - type: object
          required: [member_count, members]
          properties:
            member_count: { type: integer }
            members:
              type: array
              items: { $ref: '#/components/schemas/FamilyMember' }

    FamilySettings:
      type: object
      description: Raw `family_settings` table row (Tables<'family_settings'>['Row']).
      required: [id, family_id]
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        theme: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        notifications_enabled: { type: [boolean, 'null'] }
        sound_notifications: { type: [boolean, 'null'] }
        email_digest_frequency: { type: [string, 'null'] }
        parental_controls_enabled: { type: [boolean, 'null'] }
        require_age_verification: { type: [boolean, 'null'] }
        max_screen_time_minutes: { type: [integer, 'null'] }
        bedtime_enabled: { type: [boolean, 'null'] }
        bedtime_start: { type: [string, 'null'] }
        bedtime_end: { type: [string, 'null'] }
        enable_smart_home_control: { type: [boolean, 'null'] }
        points_system_enabled: { type: [boolean, 'null'] }
        badges_system_enabled: { type: [boolean, 'null'] }
        leaderboard_enabled: { type: [boolean, 'null'] }
        privacy_mode: { type: [boolean, 'null'] }
        allow_google_calendar_sync: { type: [boolean, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    FamilySettingsUpdatable:
      type: object
      description: Only these columns are actually applied by PATCH /api/family/settings (whitelist enforced server-side); any other keys in the request body are silently dropped.
      properties:
        theme: { type: string }
        language: { type: string }
        timezone: { type: string }
        notifications_enabled: { type: boolean }
        sound_notifications: { type: boolean }
        email_digest_frequency: { type: string }
        parental_controls_enabled: { type: boolean }
        require_age_verification: { type: boolean }
        max_screen_time_minutes: { type: integer }
        bedtime_enabled: { type: boolean }
        bedtime_start: { type: string }
        bedtime_end: { type: string }
        enable_smart_home_control: { type: boolean }
        points_system_enabled: { type: boolean }
        badges_system_enabled: { type: boolean }
        leaderboard_enabled: { type: boolean }
        privacy_mode: { type: boolean }
        allow_google_calendar_sync: { type: boolean }

    # ---------------- Activity Log ----------------
    ActivityLogEntry:
      type: object
      description: Raw `activity_log` table row (Tables<'activity_log'>['Row']).
      required: [id, user_id, activity_type, action]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        activity_type: { type: string }
        action: { type: string }
        points_earned: { type: [integer, 'null'] }
        achievement_title: { type: [string, 'null'] }
        related_item_id: { type: [string, 'null'] }
        related_item_type: { type: [string, 'null'] }
        metadata: { type: [object, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    # ---------------- External APIs ----------------
    WordDefinition:
      type: object
      properties:
        word: { type: string }
        partOfSpeech: { type: string }
        definition: { type: string }
        example: { type: string }
        synonym: { type: string }

    WordResponse:
      type: object
      properties:
        word: { type: string }
        definitions:
          type: array
          items: { $ref: '#/components/schemas/WordDefinition' }
        pronunciation: { type: string }
        audioUrl: { type: string }

    WeatherData:
      type: object
      properties:
        location: { type: string }
        temperature: { type: number, description: "Celsius, rounded." }
        feelsLike: { type: number }
        humidity: { type: number }
        windSpeed: { type: number }
        description: { type: string }
        icon: { type: string, description: "An emoji character, not an icon code/URL." }
        timestamp: { type: string, format: date-time }
        sunrise: { type: string, format: date-time }
        sunset: { type: string, format: date-time }

    ForecastItem:
      type: object
      properties:
        date: { type: string, description: "Locale date string (toLocaleDateString()), not ISO 8601." }
        high: { type: number }
        low: { type: number }
        description: { type: string }
        icon: { type: string }
        precipChance: { type: integer, description: "0-100" }
